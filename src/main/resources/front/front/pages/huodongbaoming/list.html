<!-- 我的活动 -->
<!DOCTYPE html>
<html>
<head lang="en">
<meta charset="utf-8">
<title>我的活动</title>
<meta name="keywords" content="" />
<meta name="description" content="" />
<meta name="renderer" content="webkit">
<meta http-equiv="X-UA-Compatible" content="IE=edge"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../../layui/css/layui.css">
<link rel="stylesheet" href="../../css/style.css" />
<link rel="stylesheet" href="../../css/theme.css" />
<link rel="stylesheet" href="../../css/common.css" />
</head>
<style>
	html::after {
		position: fixed;
		top: 0;
		right: 0;
		left: 0;
		bottom: 0;
		content: '';
		display: block;
		background: #f5f5f5;
		z-index: -1;
	}
	.center-wrapper {
		max-width: 1000px;
		margin: 30px auto;
		display: flex;
		background: #fff;
		border-radius: 8px;
		box-shadow: 0 2px 12px rgba(0,0,0,0.1);
		overflow: hidden;
	}
	.left-menu {
		width: 180px;
		background: #fff;
		border-right: 1px solid #eee;
		flex-shrink: 0;
	}
	.left-menu .layui-nav-tree {
		width: 100%;
	}
	.left-menu .layui-nav {
		position: relative;
		background: transparent;
	}
	.left-menu .layui-nav-item {
		height: 48px;
		line-height: 48px;
		font-size: 14px;
		color: #333;
	}
	.left-menu .layui-nav-item a {
		color: #333;
		padding: 0 20px;
	}
	.left-menu .layui-nav-item.layui-this,
	.left-menu .layui-nav-item:hover {
		background: #ff6600;
		color: #fff;
	}
	.left-menu .layui-nav-item.layui-this a,
	.left-menu .layui-nav-item:hover a {
		color: #fff;
	}
	.right-content {
		flex: 1;
		padding: 30px 40px;
		min-height: 500px;
	}
	.page-title {
		font-size: 18px;
		font-weight: 600;
		color: #333;
		margin-bottom: 25px;
		padding-bottom: 15px;
		border-bottom: 2px solid #ff6600;
	}
	.activity-list {
		display: grid;
		grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
		gap: 20px;
	}
	.activity-item {
		background: #fff;
		border-radius: 8px;
		overflow: hidden;
		box-shadow: 0 2px 8px rgba(0,0,0,0.08);
		cursor: pointer;
		transition: all 0.3s;
	}
	.activity-item:hover {
		box-shadow: 0 4px 16px rgba(255,102,0,0.2);
		transform: translateY(-2px);
	}
	.activity-item img {
		width: 100%;
		height: 140px;
		object-fit: cover;
	}
	.activity-item .info {
		padding: 15px;
	}
	.activity-item .info .title {
		font-size: 14px;
		color: #333;
		font-weight: 600;
		margin-bottom: 8px;
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: nowrap;
	}
	.activity-item .info .detail {
		font-size: 12px;
		color: #666;
		margin-bottom: 6px;
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: nowrap;
	}
	.activity-item .info .status {
		display: inline-block;
		padding: 3px 10px;
		border-radius: 3px;
		font-size: 12px;
	}
	.activity-item .info .status.approved {
		background: #e8f8f0;
		color: #36b468;
	}
	.activity-item .info .status.pending {
		background: #fff8e8;
		color: #ff9900;
	}
	.activity-item .info .status.rejected {
		background: #fef0f0;
		color: #d9534f;
	}
	.empty-tip {
		text-align: center;
		padding: 80px 0;
		color: #999;
		font-size: 14px;
	}
	.empty-tip .layui-icon {
		font-size: 48px;
		color: #ddd;
		margin-bottom: 15px;
	}
	.pager {
		text-align: center;
		padding: 30px 0 10px;
	}
</style>
<body>
	<div id="app">
		<div class="center-wrapper">
			<div class="left-menu">
				<ul class="layui-nav layui-nav-tree">
					<li v-for="(item,index) in centerMenu" v-bind:key="index" class="layui-nav-item" :class="index==2?'layui-this':''">
						<a :href="item.url" @click.prevent="jump(item.url)">{{item.name}}</a>
					</li>
				</ul>
			</div>
			<div class="right-content">
				<div class="page-title">我的活动</div>
				<div v-if="dataList.length === 0" class="empty-tip">
					<div class="layui-icon">&#xe68f;</div>
					<p>暂无报名活动</p>
				</div>
				<div v-else class="activity-list">
					<div v-for="(item,index) in dataList" :key="index" @click="goDetail(item)" class="activity-item">
						<img :src="item.picture || '../../img/avator.png'">
						<div class="info">
							<div class="title">{{item.biaoti}}</div>
							<div class="detail">主办方：{{item.shetuanmingcheng}}</div>
							<div class="detail">报名日期：{{item.baomingriqi}}</div>
							<span class="status" :class="getStatusClass(item.sfsh)">{{getStatusText(item.sfsh)}}</span>
						</div>
					</div>
				</div>
				<div class="pager" id="pager"></div>
			</div>
		</div>
	</div>

	<script src="../../layui/layui.js"></script>
	<script src="../../js/vue.js"></script>
	<script src="../../js/config.js"></script>
	<script src="../../modules/config.js"></script>
	<script src="../../js/utils.js"></script>

	<script type="text/javascript">
		var vue = new Vue({
			el: '#app',
			data: {
				dataList: [],
				centerMenu: centerMenu()
			},
			methods: {
				jump(url) {
					window.location.href = url;
				},
				goDetail(item) {
					window.location.href = 'detail.html?id=' + item.id;
				},
				getStatusClass(status) {
					if (status === '是') return 'approved';
					if (status === '否') return 'rejected';
					return 'pending';
				},
				getStatusText(status) {
					if (status === '是') return '已通过';
					if (status === '否') return '已拒绝';
					return '审核中';
				}
			}
		});

		layui.use(['layer', 'http', 'jquery', 'laypage'], function() {
			var layer = layui.layer;
			var http = layui.http;
			var jquery = layui.jquery;
			var laypage = layui.laypage;

			var limit = 9;

			pageList();

			function pageList() {
				var param = {
					page: 1,
					limit: limit,
					userid: localStorage.getItem('userid')
				}

				http.request('huodongbaoming/list', 'get', param, function(res) {
					vue.dataList = res.data.list || [];
					laypage.render({
						elem: 'pager',
						count: res.data.total || 0,
						limit: limit,
						groups: 5,
						layout: ["prev", "page", "next"],
						theme: '#FF9900',
						jump: function(obj, first) {
							if (!first) {
								param.page = obj.curr;
								http.request('huodongbaoming/list', 'get', param, function(res) {
									vue.dataList = res.data.list || [];
								})
							}
						}
					});
				});
			}
		});
	</script>
</body>
</html>
