
<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">

		<!-- bootstrap样式，地图插件使用 -->

	<style>
		html::after {
			position: fixed;
			top: 0;
			right: 0;
			left: 0;
			bottom: 0;
			content: '';
			display: block;
			background-attachment: fixed;
			background-size: cover;
			background-position: center;
			z-index: -1;
		}
		#swiper {
			overflow: hidden;
			margin: 0 auto;
		}
		#swiper .layui-carousel-ind li {
			width: 20px;
			height: 20px;
			border-width: 0;
			border-style: solid;
			border-color: rgba(255, 255, 255, 0.3);
			border-radius: 10px;
			background-color: rgba(255, 255, 255, 1);
			box-shadow: 0 0 0px rgba(255,0,0,.8);
		}
		#swiper .layui-carousel-ind li.layui-this {
			width: 20px;
			height: 20px;
			border-width: 0;
			border-style: solid;
			border-color: rgba(0,0,0,.3);
			border-radius: 10;
			background-color: rgba(255, 153, 0, 1);
			box-shadow: 0 0 0px rgba(255,0,0,.8);
		}
		
		button, button:focus {
			outline: none;
		}
		
		.data-add-container .add .layui-select-title .layui-unselect {
			padding: 0 12px;
			height: 40px;
			font-size: 14px;
			color: #333;
			border-radius: 4px;
			border-width: 1px;
			border-style: solid;
			border-color: #DCDFE6;
			background-color: #fff;
			box-shadow: 0 0 6px rgba(213, 213, 213, 0.3);
			text-align: left;
		}
		.data-add-container .add .layui-form-item {
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.data-add-container .layui-form-pane .layui-form-item[pane] .layui-form-label {
			margin: 0;
			position: inherit;
			background: transparent;
			border: 0;
		}
		.data-add-container .add .layui-input-block {
			margin: 0;
			flex: 1;
		}
		.data-add-container .layui-form-pane .layui-form-item[pane] .layui-input-inline {
			margin: 0;
			flex: 1;
			display: flex;
		}
		/* 报名页面头部样式 */
		.add-page-header {
			max-width: 900px;
			margin: 20px auto 0;
			padding: 0 20px;
		}
		.add-page-title {
			display: flex;
			align-items: center;
			background: #fff;
			padding: 16px 24px;
			border-radius: 10px 10px 0 0;
		}
		.add-page-title h3 {
			margin: 0;
			font-size: 18px;
			font-weight: 600;
			color: #333;
		}
		.add-back-btn {
			display: inline-flex;
			align-items: center;
			gap: 4px;
			margin-right: 16px;
			padding: 6px 0;
			background: none;
			color: #999;
			border: none;
			font-size: 14px;
			cursor: pointer;
			transition: color 0.2s;
		}
		.add-back-btn:hover {
			color: #ff6600;
		}
		/* 报名表单样式优化 */
		.data-add-container .add-form-item {
			padding: 12px 0 !important;
			margin: 0 0 8px 0 !important;
			border-bottom: 1px solid #f0f0f0 !important;
			box-shadow: none !important;
			border-radius: 0 !important;
		}
		.data-add-container .add-form-label {
			width: 94px !important;
			padding: 0 12px 0 0 !important;
			font-size: 14px !important;
			color: #333 !important;
			text-align: right !important;
			font-weight: 500 !important;
		}
		.data-add-container .add-form-input {
			padding: 0 12px !important;
			height: 40px !important;
			border: 1px solid #DCDFE6 !important;
			border-radius: 4px !important;
			font-size: 14px !important;
			color: #333 !important;
			box-shadow: none !important;
			transition: border-color 0.2s;
		}
		.data-add-container .add-form-input:focus {
			border-color: #ff6600 !important;
		}
		.data-add-container .add-form-input[readonly] {
			background: #f9f9f9 !important;
			cursor: not-allowed;
		}
		.data-add-container .add-submit-btn {
			padding: 0 32px !important;
			height: 44px !important;
			background: #ff6600 !important;
			color: #fff !important;
			border: none !important;
			border-radius: 8px !important;
			font-size: 15px !important;
			cursor: pointer !important;
			transition: background 0.2s;
		}
		.data-add-container .add-submit-btn:hover {
			background: #ff8533 !important;
		}
	</style>
	<body style="background: #EEEEEE; ">


		<div id="app">

			<!--
			<div class="layui-carousel" id="swiper">
				<div carousel-item id="swiper-item">
					<div v-for="(item,index) in swiperList" v-bind:key="index">
						<img class="swiper-item" :src="item.img">
					</div>
				</div>
			</div> -->
			<div class="layui-carousel" id="swiper" :style='{"boxShadow":"0 0 0px rgba(255,0,0,.8)","margin":"0 auto","borderColor":"rgba(255, 255, 255, 0.3)","borderRadius":"0px","borderWidth":"0","width":"90%","borderStyle":"solid"}'>
			  <div carousel-item id="swiper-item">
				<div v-for="(item,index) in swiperList" :key="index">
					<img style="width: 100%;height: 100%;object-fit:cover;" :src="item.img" />
				</div>
			  </div>
			</div>
			<!-- 轮播图 -->

			<div class="add-page-header">
				<div class="add-page-title">
					<button class="add-back-btn" @click="goBackToDetail">← 返回活动详情</button>
					<h3>活动报名</h3>
				</div>
			</div>

			<div class="data-add-container" :style='{"padding":"20px","boxShadow":"1px 1px 6px rgba(213, 213, 213, 0.3)","margin":"0 auto 30px","borderColor":"rgba(213, 213, 213, 0.3)","backgroundColor":"#fff","borderRadius":"0 0 10px 10px","borderWidth":"1px","borderStyle":"solid"}'>

				<form class="layui-form layui-form-pane add" lay-filter="myForm">
					
                    <div  class="layui-form-item add-form-item" pane>
						<label  class="layui-form-label add-form-label">标题：</label>
						<div class="layui-input-block">

							<input v-model="detail.biaoti" type="text" :readonly="ro.biaoti" name="biaoti" id="biaoti" autocomplete="off" class="layui-input add-form-input">
						</div>
					</div>
                    <div  class="layui-form-item add-form-item" pane>
						<label  class="layui-form-label add-form-label">主办方名称：</label>
						<div class="layui-input-block">

							<input v-model="detail.shetuanmingcheng" type="text" :readonly="ro.shetuanmingcheng" name="shetuanmingcheng" id="shetuanmingcheng" autocomplete="off" class="layui-input add-form-input">
						</div>
					</div>
                    <div  class="layui-form-item add-form-item" pane>
						<label  class="layui-form-label add-form-label">账号：</label>
						<div class="layui-input-block">

							<input v-model="detail.zhanghao" type="text" :readonly="ro.zhanghao" name="zhanghao" id="zhanghao" autocomplete="off" class="layui-input add-form-input">
						</div>
					</div>
                    <div  class="layui-form-item add-form-item" pane>
						<label  class="layui-form-label add-form-label">报名内容：</label>
						<div class="layui-input-block">

							<input v-model="detail.baomingneirong" type="text" :readonly="ro.baomingneirong" name="baomingneirong" id="baomingneirong" autocomplete="off" class="layui-input add-form-input">
						</div>
					</div>
                    <div  class="layui-form-item add-form-item" pane>
						<label  class="layui-form-label add-form-label">报名日期：</label>
						<div class="layui-input-block">

							<input type="text" name="baomingriqi" id="baomingriqi" autocomplete="off" class="layui-input add-form-input">
						</div>
					</div>
                    <div  class="layui-form-item add-form-item" pane>
						<label  class="layui-form-label add-form-label">学号：</label>
						<div class="layui-input-block">

							<input v-model="detail.xuehao" type="text" :readonly="ro.xuehao" name="xuehao" id="xuehao" autocomplete="off" class="layui-input add-form-input">
						</div>
					</div>
                    <div  class="layui-form-item add-form-item" pane>
						<label  class="layui-form-label add-form-label">学生姓名：</label>
						<div class="layui-input-block">

							<input v-model="detail.xueshengxingming" type="text" :readonly="ro.xueshengxingming" name="xueshengxingming" id="xueshengxingming" autocomplete="off" class="layui-input add-form-input">
						</div>
					</div>
                    <div  class="layui-form-item add-form-item" pane>
						<label  class="layui-form-label add-form-label">手机：</label>
						<div class="layui-input-block">

							<input v-model="detail.shouji" type="text" :readonly="ro.shouji" name="shouji" id="shouji" autocomplete="off" class="layui-input add-form-input">
						</div>
					</div>


					<div class="add-form-item" pane>
						<div class="layui-input-block" style="text-align: right;">
							<button class="layui-btn add-submit-btn" lay-submit lay-filter="*">提交报名</button>
						</div>
					</div>
				</form>
			</div>
		</div>

		<script src="../../layui/layui.js"></script>
		<script src="../../js/vue.js"></script>
		<!-- 组件配置信息 -->
		<script src="../../js/config.js"></script>
		<!-- 扩展插件配置信息 -->
		<script src="../../modules/config.js"></script>
		<!-- 工具方法 -->
		<script src="../../js/utils.js"></script>
		<!-- 校验格式工具类 -->
		<script src="../../js/validate.js"></script>
		<!-- 地图 -->
		<script type="text/javascript" src="../../js/jquery.js"></script>
		<script type="text/javascript" src="http://webapi.amap.com/maps?v=1.3&key=ca04cee7ac952691aa67a131e6f0cee0"></script>
		<script type="text/javascript" src="../../js/bootstrap.min.js"></script>
		<script type="text/javascript" src="../../js/bootstrap.AMapPositionPicker.js"></script>

		<script>
			var jquery = $;
			
			var vue = new Vue({
				el: '#app',
				data: {
					// 轮播图
					swiperList: [{
						img: '../../img/banner.jpg'
					}],
					dataList: [],
      					ro:{
				        biaoti : false,
				        shetuanmingcheng : false,
				        zhanghao : false,
				        baomingneirong : false,
				        baomingriqi : false,
				        xuehao : false,
				        xueshengxingming : false,
				        shouji : false,
				        sfsh : false,
				        shhf : false,
              				},
                    detail: {
                        biaoti: '',
                        shetuanmingcheng: '',
                        zhanghao: '',
                        baomingneirong: '',
                        baomingriqi: '',
                        xuehao: '',
                        xueshengxingming: '',
                        shouji: '',
                        sfsh: '',
                        shhf: '',
                    },
					centerMenu: centerMenu
				},
				updated: function() {
					layui.form.render('select', 'myForm');
				},
                computed: {
                },
				methods: {
					jump(url) {
						jump(url)
					},
					goBackToDetail() {
						var crossObj = {};
						try {
							crossObj = JSON.parse(localStorage.getItem('crossObj') || '{}');
						} catch(e) {}
						var id = crossObj.id || '';
						if (id) {
							window.location.href = '../shetuanhuodong/detail.html?id=' + id;
						} else {
							back();
						}
					}
				}
			})


			layui.use(['layer', 'element', 'carousel', 'http', 'jquery', 'form', 'upload', 'laydate','tinymce'], function() {
				var layer = layui.layer;
				var element = layui.element;
				var carousel = layui.carousel;
				var http = layui.http;
				var jquery = layui.jquery;
				var form = layui.form;
				var upload = layui.upload;
				var laydate = layui.laydate;
                var tinymce = layui.tinymce

				// 获取轮播图 数据
				http.request('config/list', 'get', {
					page: 1,
					limit: 5
				}, function(res) {
					if (res.data.list.length > 0) {
						var swiperItemHtml = '';
						for (let item of res.data.list) {
							if (item.name.indexOf('picture') >= 0 && item.value && item.value != "" && item.value != null) {
								swiperItemHtml +=
									'<div>' +
									'<img style="width: 100%;height: 100%;object-fit:cover;" class="swiper-item" src="' + item.value + '">' +
									'</div>';
							}
						}
						jquery('#swiper-item').html(swiperItemHtml);
						// 轮播图
						vue.$nextTick(() => {
						  carousel.render({
						  	elem: '#swiper',
							width: '90%',
						  	height: '500px',
						  	arrow: 'hover',
						  	anim: 'default',
						  	autoplay: 'true',
						  	interval: '3000',
						  	indicator: 'inside'
						  });
						
						})
						// carousel.render({
						// 	elem: '#swiper',
						// 	width: swiper.width,height:swiper.height,
						// 	arrow: swiper.arrow,
						// 	anim: swiper.anim,
						// 	interval: swiper.interval,
						// 	indicator: "none"
						// });
					}
				});

				jquery('#baomingriqi').val(getCurDateTime());
				laydate.render({
					elem: '#baomingriqi',
					type: 'datetime'
				});
				
                // session读取 - 自动填充用户信息
				let table = localStorage.getItem("userTable");
				http.request(`${table}/session`, 'get', {}, function(data) {
					data = data.data
					for (var key in data){
					if(key=='xuehao'){
						vue.detail[`${key}`] = data[`${key}`]
						vue.ro.xuehao = true;
						continue;
                                        }
					if(key=='xueshengxingming'){
						vue.detail[`${key}`] = data[`${key}`]
						vue.ro.xueshengxingming = true;
						continue;
                                        }
					if(key=='shouji'){
						vue.detail[`${key}`] = data[`${key}`]
						continue;
                                        }
					if(key=='zhanghao'){
						vue.detail[`${key}`] = data[`${key}`]
						vue.ro.zhanghao = true;
						continue;
                                        }
                                        }
				});

                // 跨表
                if(http.getParam('corss')){
					var obj = JSON.parse(localStorage.getItem('crossObj'));
					for (var o in obj){
					if(o=='biaoti'){
          	                                vue.detail[o] = obj[o];
						vue.ro.biaoti = true;
						continue;
                                        }
					if(o=='shetuanmingcheng'){
          	                                vue.detail[o] = obj[o];
						vue.ro.shetuanmingcheng = true;
						continue;
                                        }
					if(o=='zhanghao'){
          	                                vue.detail[o] = obj[o];
						vue.ro.zhanghao = true;
						continue;
                                        }
					if(o=='baomingneirong'){
          	                                vue.detail[o] = obj[o];
						vue.ro.baomingneirong = true;
						continue;
                                        }
					if(o=='baomingriqi'){
          	                                vue.detail[o] = obj[o];
						vue.ro.baomingriqi = true;
						continue;
                                        }
					if(o=='xuehao'){
          	                                vue.detail[o] = obj[o];
						vue.ro.xuehao = true;
						continue;
                                        }
					if(o=='xueshengxingming'){
          	                                vue.detail[o] = obj[o];
						vue.ro.xueshengxingming = true;
						continue;
                                        }
					if(o=='shouji'){
          	                                vue.detail[o] = obj[o];
						vue.ro.shouji = true;
						continue;
                                        }
                                        }
				}
				

				// 提交
				form.on('submit(*)', function(data) {
					data = data.field;
					
                    // 数据校验

					// 跨表计算
					
                    // 比较大小
					
					// 提交数据
					http.requestJson('huodongbaoming' + '/add', 'post', data, function(res) {
					 	layer.msg('提交成功', {
					 		time: 2000,
					 		icon: 6
					 	}, function() {
					 		var crossObj = {};
							try {
								crossObj = JSON.parse(localStorage.getItem('crossObj') || '{}');
							} catch(e) {}
							var id = crossObj.id || '';
							if (id) {
								window.location.href = '../shetuanhuodong/detail.html?id=' + id;
							} else {
								back();
							}
						});
					 });

					return false
				});

			});
		</script>
	</body>
</html>
