<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>校园活动系统 - 登录</title>
    <link rel="stylesheet" type="text/css" href="../../layui/css/layui.css">
    <link rel="stylesheet" type="text/css" href="../../xznstatic/css/public.css"/>
    <link rel="stylesheet" type="text/css" href="../../xznstatic/css/login.css"/>
    <style type="text/css">
    	/* ===== Background & Layout ===== */
    	html, body {
    		width: 100%;
    		height: 100%;
    		margin: 0;
    		padding: 0;
    	}
    	.login {
    		display: flex;
    		justify-content: center;
    		align-items: center;
    		width: 100%;
    		height: 100%;
    		position: relative;
    		background: #f5f7fa;
    	}
	
	/* ===== Left-Right Layout ===== */
	.login-container {
		display: flex;
		width: 900px;
		max-width: 90%;
		min-height: 500px;
		background: #fff;
		border-radius: 12px;
		overflow: hidden;
		box-shadow: 0 4px 20px rgba(0,0,0,0.08);
	}
	
	/* ===== Left Side - Info Panel ===== */
	.login-left {
		flex: 0 0 45%;
		background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
		padding: 60px 40px;
		display: flex;
		flex-direction: column;
		justify-content: center;
		color: #fff;
		position: relative;
		z-index: 1;
		box-sizing: border-box;
	}
	
	.login-left .info-title {
		font-size: 32px;
		font-weight: 700;
		margin-bottom: 20px;
		letter-spacing: 2px;
	}
	
	.login-left .info-subtitle {
		font-size: 16px;
		margin-bottom: 40px;
		opacity: 0.9;
		letter-spacing: 1px;
	}
	
	.login-left .info-features {
		list-style: none;
		padding: 0;
		margin: 0;
	}
	
	.login-left .info-features li {
		font-size: 14px;
		margin-bottom: 15px;
		padding-left: 24px;
		position: relative;
		opacity: 0.9;
	}
	
	.login-left .info-features li:before {
		content: "✓";
		position: absolute;
		left: 0;
		color: #fff;
		font-weight: bold;
	}
	
	/* ===== Right Side - Login Form ===== */
	.login-right {
		flex: 0 0 55%;
		padding: 50px 40px;
		background: #fff;
		display: flex;
		align-items: center;
		justify-content: center;
		position: relative;
		z-index: 2;
		box-sizing: border-box;
	}
    
    	#loginForm {
    		position: relative;
    		z-index: 3;
    		animation: formFadeIn 0.6s ease;
    		width: 100%;
    		max-width: 400px;
    	}
    	@keyframes formFadeIn {
    		from { opacity: 0; transform: translateX(20px); }
    		to { opacity: 1; transform: translateX(0); }
    	}
    	.login form {
    		box-sizing: border-box;
    		min-height: auto;
    		display: flex;
    		flex-direction: column;
    		justify-content: center !important;
    		position: relative;
    		background: transparent;
    		box-shadow: none;
    		border: none;
    		border-radius: 0;
    		padding: 20px 0 !important;
    		width: 100% !important;
    		margin: 0 auto;
    	}
    	.login .logo, .login .title {
    		box-sizing: border-box;
    	}
    	.login .logo img {
    		display: block;
    	}
    	.login .title {
    		text-align: center;
    	}
    	.login .form-item {
    		display: flex;
    		align-items: center;
    		flex-wrap: wrap;
    		box-sizing: border-box;
    	}
    	.login .form-item input, .login .form-label {
    		box-sizing: border-box;
    	}
    	.login .btn-submit {
    		display: block;
    		box-sizing: border-box;
    	}
    	.login form p.txt {
    		width: 100%;
    		margin: 0;
    		box-sizing: border-box;
    	}

    	/* ===== Role Radio Buttons ===== */
		.l-redio {
			display: flex !important;
			justify-content: center;
			gap: 20px;
			padding: 6px 0 !important;
		}
		.l-redio .layui-form-radio {
			margin: 0;
		}
		.l-redio .layui-form-radio>i {
			font-size: 18px;
			color: #DCDFE6;
		}
		.l-redio .layui-form-radio>div {
			font-size: 14px;
			color: #999;
		}
		.l-redio .layui-form-radioed>i {
			font-size: 18px;
			color: rgba(255, 153, 0, 1);
		}
		.l-redio .layui-form-radioed>div {
			font-size: 14px;
			color: rgba(255, 153, 0, 1);
		}

		/* ===== Captcha (disabled) ===== */
		#loginForm .codes {
			display: none;
		}
		#loginForm .codes input {
			width: calc(100% - 84px);
			height: 44px;
			margin: 0;
			color: #1e90ff;
			font-size: 14px;
			padding: 0 10px;
			border-radius: 0;
			border-width: 1px;
			border-style: solid;
			border-color: #1e90ff;
			background-color: #fff;
			box-shadow: 0 0 6px rgba(30, 144, 255, 0);
			outline: none;
		}
		#loginForm .codes .nums {
			width: 84px;
			height: 44px;
			margin: 0;
			color: #333;
			font-size: 14px;
			padding: 0;
			border-radius: 0;
			border-width: 1px 1px 1px 0;
			border-style: solid;
			border-color: #1e90ff;
			background-color: #f5f5f5;
			box-shadow: 0 0 6px rgba(30, 144, 255, 0);
			outline: none;
			box-sizing: border-box;
		}

		/* ===== Responsive: Stack columns on small screens ===== */
		@media (max-width: 768px) {
			.login-container {
				flex-direction: column;
				width: 100%;
				max-width: 100%;
				min-height: auto;
				border-radius: 0;
				box-shadow: none;
			}
			.login-left {
				flex: 0 0 auto;
				padding: 40px 20px;
				text-align: center;
			}
			.login-left .info-title {
				font-size: 26px;
			}
			.login-left .info-subtitle {
				font-size: 14px;
				margin-bottom: 20px;
			}
			.login-left .info-features {
				display: none;
			}
			.login-right {
				flex: 0 0 auto;
				padding: 30px 20px;
			}
			#loginForm {
				max-width: 100%;
			}
		}

		@media (max-width: 480px) {
			.login-left {
				padding: 20px 15px;
			}
			.login-left .info-title {
				font-size: 20px;
			}
			.login-left .info-subtitle {
				font-size: 12px;
				margin-bottom: 0;
			}
			.login-right {
				padding: 20px 15px;
			}
		}

    </style>
</head>
<body>
    <div id="app" class="login">
		<div class="login-container">
			<!-- Left Side - Info Panel -->
			<div class="login-left">
				<div class="info-title">校园活动系统</div>
				<div class="info-subtitle">Campus Activity Management System</div>
				<ul class="info-features">
					<li>丰富的社团活动管理</li>
					<li>便捷的活动报名系统</li>
					<li>实时的消息通知服务</li>
					<li>完善的社团信息管理</li>
				</ul>
			</div>
			
			<!-- Right Side - Login Form -->
			<div class="login-right">
				<form id="loginForm" class="layui-form login-form">
            <h1 class="logo" v-if="false" :style='{"padding":"5px 0","boxShadow":"0 0 0px rgba(255,0,0,.8)","borderColor":"rgba(0,0,0,.3)","backgroundColor":"rgba(255, 255, 255, 0)","borderRadius":"6px","borderWidth":"0","borderStyle":"solid"}'><img :style='{"boxShadow":"0 0 0px rgba(255,0,0,.8)","margin":"0 auto","borderColor":"rgba(255, 255, 255, 0.3)","backgroundColor":"rgba(255, 255, 255, 0)","borderRadius":"0","borderWidth":"0px","width":"140px","borderStyle":"solid","height":"140px"}' src="http://codegen.caihongy.cn/20210123/46be50155ce34c7fb71f292d03774a77.png"></h1>
            
            <div class="msg-warn hide title" v-if="false" :style='{"padding":"0 10px","boxShadow":"0 0 0px rgba(255,0,0,.8)","margin":"10px auto","borderColor":"rgba(0,0,0,1)","backgroundColor":"rgba(255, 255, 255, 0)","color":"rgba(255, 255, 255, 1)","isshow":false,"borderRadius":"8px","borderWidth":"0","width":"auto","lineHeight":"32px","fontSize":"0","borderStyle":"solid"}'>公共场所不建议自动登录，以防账号丢失</div>

            <!-- Account Input -->
            <div :style='{"padding":"0","boxShadow":"0 0 0px rgba(255,0,0,0)","margin":"0 auto 8px","borderColor":"rgba(0,0,0,1)","backgroundColor":"rgba(255, 255, 255, 0.1)","borderRadius":"0","borderWidth":"0","width":"85%","borderStyle":"solid","height":"auto"}' class="form-item">
                <label v-if="false" :style='{"padding":"0 10px","boxShadow":"0 0 6px rgba(255,0,0,0)","borderColor":"rgba(0,0,0,0)","backgroundColor":"transparent","color":"#333","borderRadius":"0","textAlign":"right","borderWidth":"0","width":"84px","fontSize":"16px","borderStyle":"solid"}' class="form-label">账号</label>
				<div style="position:relative;width:100%;">
					<span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#bbb;font-size:16px;z-index:1;">👤</span>
					<input :style='{"padding":"0 10px 0 42px","boxShadow":"0 2px 6px rgba(0,0,0,0.06)","borderColor":"rgba(220,220,220,0.8)","backgroundColor":"rgba(249,249,249,0.9)","color":"rgba(51,51,51,1)","borderRadius":"10px","textAlign":"left","borderWidth":"1px","width":"100%","fontSize":"14px","borderStyle":"solid","height":"48px"}' type="text" name="username" required lay-verify="required" placeholder="请输入账号" autocomplete="off" class="layui-input">
				</div>
            </div>

            <!-- Password Input -->
            <div :style='{"padding":"0","boxShadow":"0 0 0px rgba(255,0,0,0)","margin":"0 auto 8px","borderColor":"rgba(0,0,0,1)","backgroundColor":"rgba(255, 255, 255, 0.1)","borderRadius":"0","borderWidth":"0","width":"85%","borderStyle":"solid","height":"auto"}' class="form-item">
                <label v-if="false" :style='{"padding":"0 10px","boxShadow":"0 0 6px rgba(255,0,0,0)","borderColor":"rgba(0,0,0,0)","backgroundColor":"transparent","color":"#333","borderRadius":"0","textAlign":"right","borderWidth":"0","width":"84px","fontSize":"16px","borderStyle":"solid"}' class="form-label">密码</label>
				<div style="position:relative;width:100%;">
					<span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#bbb;font-size:16px;z-index:1;">🔒</span>
					<input :style='{"padding":"0 10px 0 42px","boxShadow":"0 2px 6px rgba(0,0,0,0.06)","borderColor":"rgba(220,220,220,0.8)","backgroundColor":"rgba(249,249,249,0.9)","color":"rgba(51,51,51,1)","borderRadius":"10px","textAlign":"left","borderWidth":"1px","width":"100%","fontSize":"14px","borderStyle":"solid","height":"48px"}' type="password" name="password" required lay-verify="required" placeholder="请输入密码" autocomplete="off" class="layui-input">
				</div>
            </div>

			<!-- Captcha disabled -->
			<div :style='{"padding":"0","boxShadow":"0 0 0px rgba(255,0,0,0)","margin":"0 auto","borderColor":"rgba(0,0,0,1)","backgroundColor":"rgba(255, 255, 255, 0.1)","borderRadius":"0","borderWidth":"0 00px 0","width":"80%","borderStyle":"solid","height":"64px"}' class="form-item codes">
			  <input style="flex: 1;" type="text" id="code" placeholder="请输入验证码">
			  <div class="nums" id="nums" style="display: flex;justify-content: center;align-items: center;"></div>
			</div>

			<!-- Role Selection -->
            <div :style='{"padding":"4px 0","boxShadow":"0 0 6px rgba(255,0,0,0)","margin":"0 auto","borderColor":"rgba(0,0,0,1)","backgroundColor":"rgba(255, 255, 255, 0.1)","borderRadius":"0","borderWidth":"0","width":"85%","borderStyle":"solid","height":"auto"}' class="form-item l-redio">
				<input v-if="item.hasFrontLogin=='是'" v-for="(item,index) in menu" v-bind:key="index" type="radio" name="role" id="role" :value="item.tableName" :title="item.roleName">
            </div>

            <!-- Login Button -->
            <div style="text-align:center;width:85%;margin:0 auto;">
				<button :style='{"padding":"0","boxShadow":"0 4px 14px rgba(255,153,0,0.35)","margin":"6px 0 0","borderColor":"#ccc","background":"linear-gradient(135deg, #ff9900 0%, #ff7700 100%)","color":"#fff","borderRadius":"10px","borderWidth":"0","width":"100%","fontSize":"16px","fontWeight":"600","letterSpacing":"2px","lineHeight":"","borderStyle":"solid","height":"48px"}' class="layui-btn layui-btn-fluid layui-btn-danger btn-submit" lay-submit lay-filter="login">登 录</button>
            </div>

					<!-- Register Links -->
            <p :style='{"color":"rgba(255, 153, 0, 1)","textAlign":"center","fontSize":"14px","marginTop":"16px"}' class="txt"><a style="color: inherit;font-size: inherit;" v-if="item.hasFrontRegister=='是'" v-for="(item,index) in menu" v-bind:key="index" :href="'javascript:registerClick(\''+item.tableName+'\')'">注册{{item.roleName.replace('注册','')}}</a></p>
        				</form>
			</div>
		</div>
    </div>

    <script src="../../layui/layui.js"></script>
    <script src="../../js/vue.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../modules/config.js"></script>
    <script src="../../js/utils.js"></script>
    <script type="text/javascript">
        var vue = new Vue({
            el: '#app',
            data: {
                menu: menu
            },
            methods: {
                jump(url) {
                    jump(url)
                }
            }
        })
	var codes = [{
			num: 1,
			color: '#000',
			rotate: '10deg',
			size: '16px'
		  }, {
			num: 2,
			color: '#000',
			rotate: '10deg',
			size: '16px'
		  }, {
			num: 3,
			color: '#000',
			rotate: '10deg',
			size: '16px'
		  }, {
			num: 4,
			color: '#000',
			rotate: '10deg',
			size: '16px'
		  }]


        layui.use(['layer', 'element', 'carousel', 'form', 'http', 'jquery'], function() {
            var layer = layui.layer;
            var element = layui.element;
            var carousel = layui.carousel;
            var form = layui.form;
            var http = layui.http;
            var jquery = layui.jquery;

            form.on('submit(login)', function(data) {
		
                data = data.field;
                if (!data.role) {
                    layer.msg('请选择登录用户类型', {
                        time: 2000,
                        icon: 5
                    });
                    return false;
                }
		if(false) {
			var arr = []
			for(var i = 0;i<codes.length;i++) {
				arr.push(codes[i].num)
			}
			if(arr.join('').toLowerCase() != jquery('#code').val().toLowerCase()) {
				alert("请输入正确的验证码");
				randomString()
				return false;
			}
		}
                http.request(data.role + '/login', 'get', data, function(res) {
                    if (res.code === 0) {
                        layer.msg('登录成功', {
                            time: 2000,
                            icon: 6
                        });
                        localStorage.setItem('Token', res.token);
                        localStorage.setItem('role', jquery('input[name="role"]:checked').attr('title'));
                        localStorage.setItem('userTable', data.role);
                        localStorage.setItem('sessionTable', data.role);
                        localStorage.setItem('adminName', data.username);
                        http.request(data.role + '/session', 'get', {}, function(sessionRes) {
                            if (sessionRes.code === 0) {
                                localStorage.setItem('userid', sessionRes.data.id);
                                var userName = sessionRes.data.zhanghao || sessionRes.data.xuehao || sessionRes.data.username || data.username;
                                localStorage.setItem('username', userName);
                                localStorage.setItem('adminName', userName);
                                window.location.href = '../../index.html';
                            } else {
                                layer.msg('获取用户信息失败', {
                                    time: 2000,
                                    icon: 5
                                });
                            }
                        }, function(sessionError) {
                            console.log('获取session失败:', sessionError);
                            layer.msg('获取用户信息失败', {
                                time: 2000,
                                icon: 5
                            });
                        });
                    } else {
                        layer.msg(res.msg || '登录失败', {
                            time: 2000,
                            icon: 5
                        });
                    }
                }, function(error) {
                    console.log('登录失败:', error);
                    layer.msg('登录失败，请检查网络连接', {
                        time: 2000,
                        icon: 5
                    });
                });
                return false
            });

        });

        function registerClick(tablename) {
            window.location.href = '../' + tablename + '/register.html?tablename=' + tablename;
        }

    </script>
</body>
</html>
