<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>修改密码</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <style>
        .center-wrapper {
            display: flex;
            min-height: 500px;
        }
        .left-menu {
            width: 180px;
            background: #f5f5f5;
            border-right: 1px solid #eee;
            flex-shrink: 0;
        }
        .left-menu .layui-nav-tree {
            width: 100%;
        }
        .left-menu .layui-nav {
            position: relative;
            background: transparent;
        }
        .left-menu .layui-nav-item {
            height: 48px;
            line-height: 48px;
            font-size: 14px;
            color: #333;
        }
        .left-menu .layui-nav-item a {
            color: #333;
            padding: 0 20px;
        }
        .left-menu .layui-nav-item.layui-this,
        .left-menu .layui-nav-item:hover {
            background: #ff9900;
            color: #fff;
        }
        .left-menu .layui-nav-item.layui-this a,
        .left-menu .layui-nav-item:hover a {
            color: #fff;
        }
        .right-content {
            flex: 1;
            padding: 30px 40px;
            min-height: 500px;
        }
        .page-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #ff9900;
        }
        .password-form {
            background: #fff;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        .form-item {
            margin-bottom: 20px;
        }
        .form-label {
            display: inline-block;
            width: 100px;
            font-size: 14px;
            color: #666;
            margin-right: 20px;
        }
        .form-input {
            width: 300px;
            padding: 8px 12px;
            border: 1px solid #eee;
            border-radius: 4px;
            font-size: 14px;
        }
        .form-input:focus {
            outline: none;
            border-color: #ff9900;
        }
        .btn {
            display: inline-block;
            padding: 8px 16px;
            border: 1px solid #ff9900;
            border-radius: 4px;
            font-size: 14px;
            background: #ff9900;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #47c07a;
        }
        .btn-outline {
            background: #fff;
            color: #ff9900;
        }
        .btn-outline:hover {
            background: #ff9900;
            color: #fff;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="center-wrapper">
            <div class="left-menu">
                <ul class="layui-nav layui-nav-tree">
                    <li v-for="(item,index) in centerMenu" v-bind:key="index" class="layui-nav-item" :class="item.name=='修改密码'?'layui-this':''">
                        <a :href="item.url" @click.prevent="jump(item.url)">{{item.name}}</a>
                    </li>
                </ul>
            </div>
            <div class="right-content">
                <div class="page-title">
                    <span>修改密码</span>
                </div>
                <div class="password-form">
                    <div class="form-item">
                        <label class="form-label">原密码：</label>
                        <input type="password" v-model="oldPassword" class="form-input" placeholder="请输入原密码">
                    </div>
                    <div class="form-item">
                        <label class="form-label">新密码：</label>
                        <input type="password" v-model="newPassword" class="form-input" placeholder="请输入新密码">
                    </div>
                    <div class="form-item">
                        <label class="form-label">确认密码：</label>
                        <input type="password" v-model="confirmPassword" class="form-input" placeholder="请再次输入新密码">
                    </div>
                    <div class="form-item">
                        <label class="form-label"></label>
                        <button class="btn" @click="submit">确定</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../../layui/layui.js"></script>
    <script src="../../js/vue.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../modules/config.js"></script>
    <script src="../../js/utils.js"></script>

    <script>
        var vue = new Vue({
            el: '#app',
            data: {
                oldPassword: '',
                newPassword: '',
                confirmPassword: '',
                centerMenu: centerMenu()
            },
            methods: {
                jump(url) {
                    window.jump(url)
                },
                submit() {
                    if (!this.oldPassword) {
                        layui.layer.msg('请输入原密码', {icon: 5});
                        return;
                    }
                    if (!this.newPassword) {
                        layui.layer.msg('请输入新密码', {icon: 5});
                        return;
                    }
                    if (this.newPassword.length < 6) {
                        layui.layer.msg('新密码长度至少6位', {icon: 5});
                        return;
                    }
                    if (this.newPassword !== this.confirmPassword) {
                        layui.layer.msg('两次输入的密码不一致', {icon: 5});
                        return;
                    }
                    
                    var userTable = localStorage.getItem('userTable');
                    var username = localStorage.getItem('adminName');
                    
                    if (userTable === 'shezhang') {
                        layui.http.request('shezhang/updatePassword', 'post', {
                            zhanghao: username,
                            oldPassword: this.oldPassword,
                            newPassword: this.newPassword
                        }, function(res) {
                            if (res.code === 0) {
                                layui.layer.msg('密码修改成功', {icon: 6}, function() {
                                    localStorage.clear();
                                    window.location.href = '../login/login.html';
                                });
                            } else {
                                layui.layer.msg('操作失败: ' + (res.msg || '未知错误'), {icon: 5});
                            }
                        }, function(error) {
                            layui.layer.msg('操作失败', {icon: 5});
                        });
                    } else if (userTable === 'xuesheng') {
                        layui.http.request('xuesheng/updatePassword', 'post', {
                            xuehao: username,
                            oldPassword: this.oldPassword,
                            newPassword: this.newPassword
                        }, function(res) {
                            if (res.code === 0) {
                                layui.layer.msg('密码修改成功', {icon: 6}, function() {
                                    localStorage.clear();
                                    window.location.href = '../login/login.html';
                                });
                            } else {
                                layui.layer.msg('操作失败: ' + (res.msg || '未知错误'), {icon: 5});
                            }
                        }, function(error) {
                            layui.layer.msg('操作失败', {icon: 5});
                        });
                    }
                }
            }
        });
    </script>
</body>
</html>
