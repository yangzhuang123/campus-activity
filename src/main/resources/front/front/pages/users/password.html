
<!-- 修改密码 -->
<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
		<title>修改密码</title>
		<link rel="stylesheet" href="../../layui/css/layui.css">
		<link rel="stylesheet" href="../../css/style.css" />
		<link rel="stylesheet" href="../../css/theme.css" />
		<link rel="stylesheet" href="../../css/common.css" />
	</head>
	<style>
		html::after {
			position: fixed;
			top: 0;
			right: 0;
			left: 0;
			bottom: 0;
			content: '';
			display: block;
			background: #f5f5f5;
			z-index: -1;
		}
		.center-wrapper {
			max-width: 1000px;
			margin: 30px auto;
			display: flex;
			background: #fff;
			border-radius: 8px;
			box-shadow: 0 2px 12px rgba(0,0,0,0.1);
			overflow: hidden;
		}
		.left-menu {
			width: 180px;
			background: #fff;
			border-right: 1px solid #eee;
			flex-shrink: 0;
		}
		.left-menu .layui-nav-tree {
			width: 100%;
		}
		.left-menu .layui-nav {
			position: relative;
			background: transparent;
		}
		.left-menu .layui-nav-item {
			height: 48px;
			line-height: 48px;
			font-size: 14px;
			color: #333;
		}
		.left-menu .layui-nav-item a {
			color: #333;
			padding: 0 20px;
		}
		.left-menu .layui-nav-item.layui-this,
		.left-menu .layui-nav-item:hover {
			background: #ff6600;
			color: #fff;
		}
		.left-menu .layui-nav-item.layui-this a,
		.left-menu .layui-nav-item:hover a {
			color: #fff;
		}
		.right-content {
			flex: 1;
			padding: 30px 40px;
			min-height: 500px;
		}
		.page-title {
			font-size: 18px;
			font-weight: 600;
			color: #333;
			margin-bottom: 25px;
			padding-bottom: 15px;
			border-bottom: 2px solid #ff6600;
		}
		.password-form {
			max-width: 400px;
		}
		.form-item {
			margin-bottom: 20px;
			display: flex;
			align-items: center;
		}
		.form-item label {
			width: 90px;
			font-size: 14px;
			color: #666;
			text-align: right;
			padding-right: 15px;
		}
		.form-item .input {
			flex: 1;
		}
		.form-item input {
			width: 100%;
			height: 40px;
			border: 1px solid #ddd;
			border-radius: 4px;
			padding: 0 12px;
			font-size: 14px;
		}
		.form-item input:focus {
			border-color: #ff6600;
			outline: none;
		}
		.btn-group {
			display: flex;
			gap: 15px;
			margin-top: 30px;
			padding-top: 20px;
			border-top: 1px solid #eee;
		}
		.btn {
			padding: 0 30px;
			height: 40px;
			line-height: 40px;
			border-radius: 4px;
			font-size: 14px;
			cursor: pointer;
			border: none;
		}
		.btn-primary {
			background: #ff6600;
			color: #fff;
		}
		.btn-primary:hover {
			background: #ff8533;
		}
	</style>
	<body>
		<div id="app">
			<div class="center-wrapper">
				<div class="left-menu">
					<ul class="layui-nav layui-nav-tree">
						<li v-for="(item,index) in centerMenu" v-bind:key="index" class="layui-nav-item" :class="index==3?'layui-this':''">
							<a :href="item.url" @click.prevent="jump(item.url)">{{item.name}}</a>
						</li>
					</ul>
				</div>
				<div class="right-content">
					<div class="page-title">修改密码</div>
					<div class="password-form">
						<form class="layui-form" lay-filter="myForm">
							<div class="form-item">
								<label>原密码</label>
								<div class="input">
									<input type="password" name="password" id="password" v-model="ruleForm.password" placeholder="请输入原密码" class="layui-input">
								</div>
							</div>
							<div class="form-item">
								<label>新密码</label>
								<div class="input">
									<input type="password" name="newpassword" id="newpassword" v-model="ruleForm.newpassword" placeholder="请输入新密码" class="layui-input">
								</div>
							</div>
							<div class="form-item">
								<label>确认密码</label>
								<div class="input">
									<input type="password" name="repassword" id="repassword" v-model="ruleForm.repassword" placeholder="请再次输入新密码" class="layui-input">
								</div>
							</div>
							<div class="btn-group">
								<button type="button" class="btn btn-primary" @click="onUpdateHandler">确 定</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>

		<script src="../../layui/layui.js"></script>
		<script src="../../js/vue.js"></script>
		<script src="../../js/config.js"></script>
		<script src="../../modules/config.js"></script>
		<script src="../../js/utils.js"></script>
		<script src="../../js/validate.js"></script>

		<script>
			var vue = new Vue({
				el: '#app',
				data: {
					ruleForm: {
						password: '',
						newpassword: '',
						repassword: ''
					},
					user: {},
					centerMenu: centerMenu()
				},
				methods: {
					jump(url) {
						jump(url)
					},
					onUpdateHandler: function() {
						var password = '';
						if (this.user.mima) {
							password = this.user.mima;
						} else if (this.user.password) {
							password = this.user.password;
						}
						if (this.ruleForm.password != password) {
							layui.layer.msg('原密码错误', { icon: 5, time: 2000 });
							return;
						}
						if (this.ruleForm.newpassword != this.ruleForm.repassword) {
							layui.layer.msg('两次密码输入不一致', { icon: 5, time: 2000 });
							return;
						}
						this.user.password = this.ruleForm.newpassword;
						this.user.mima = this.ruleForm.newpassword;
						layui.http.requestJson(getUserTable() + '/update', 'post', this.user, function(res) {
							if (res.code === 0) {
								layui.layer.msg('修改密码成功', { icon: 6, time: 2000 }, function() {
									window.location.reload();
								});
							} else {
								layui.layer.msg(res.msg, { icon: 5, time: 2000 });
							}
						});
					}
				},
				mounted: function() {
					var _this = this;
					layui.use(['layer', 'http'], function() {
						var http = layui.http;
						http.request(getUserTable() + '/session', 'get', {}, function(res) {
							if (res.code === 0) {
								_this.user = res.data;
							}
						});
					});
					layui.use(['form'], function() {
						layui.form.render();
					});
				}
			});
		</script>
	</body>
</html>
