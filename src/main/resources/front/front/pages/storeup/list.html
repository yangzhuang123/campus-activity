<!-- 我的收藏 -->
<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
		<title>我的收藏</title>
		<link rel="stylesheet" href="../../layui/css/layui.css">
		<link rel="stylesheet" href="../../css/style.css" />
		<link rel="stylesheet" href="../../css/theme.css" />
		<link rel="stylesheet" href="../../css/common.css" />
	</head>
	<style>
		.center-wrapper {
			display: flex;
			min-height: 500px;
		}
		.left-menu {
			width: 180px;
			background: #f5f5f5;
			border-right: 1px solid #eee;
			flex-shrink: 0;
		}
		.left-menu .layui-nav-tree {
			width: 100%;
		}
		.left-menu .layui-nav {
			position: relative;
			background: transparent;
		}
		.left-menu .layui-nav-item {
			height: 48px;
			line-height: 48px;
			font-size: 14px;
			color: #333;
		}
		.left-menu .layui-nav-item a {
			color: #333;
			padding: 0 20px;
		}
		.left-menu .layui-nav-item.layui-this,
		.left-menu .layui-nav-item:hover {
			background: #ff9900;
			color: #fff;
		}
		.left-menu .layui-nav-item.layui-this a,
		.left-menu .layui-nav-item:hover a {
			color: #fff;
		}
		.right-content {
			flex: 1;
			padding: 30px 40px;
			min-height: 500px;
		}
		.page-title {
			font-size: 18px;
			font-weight: 600;
			color: #333;
			margin-bottom: 25px;
			padding-bottom: 15px;
			border-bottom: 2px solid #ff9900;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}
		.collection-list {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
			gap: 20px;
		}
		.collection-item {
			background: #fff;
			border-radius: 8px;
			overflow: hidden;
			box-shadow: 0 2px 8px rgba(0,0,0,0.08);
			cursor: pointer;
			transition: all 0.3s;
		}
		.collection-item:hover {
			box-shadow: 0 4px 16px rgba(54,176,104,0.2);
			transform: translateY(-2px);
		}
		.collection-item img {
			width: 100%;
			height: 140px;
			object-fit: cover;
		}
		.collection-item .info {
			padding: 15px;
		}
		.collection-item .info .name {
			font-size: 14px;
			color: #333;
			margin-bottom: 8px;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}
		.collection-item .info .time {
			font-size: 12px;
			color: #999;
			margin-bottom: 12px;
		}
		.collection-item .delete-btn {
			width: 100%;
			padding: 8px;
			background: #fff;
			color: #ff9900;
			border: 1px solid #ff9900;
			border-radius: 4px;
			cursor: pointer;
			font-size: 13px;
			transition: all 0.3s;
		}
		.collection-item .delete-btn:hover {
			background: #ff9900;
			color: #fff;
		}
		.empty-tip {
			text-align: center;
			padding: 80px 0;
			color: #999;
			font-size: 14px;
		}
		.empty-tip .layui-icon {
			font-size: 48px;
			color: #ddd;
			margin-bottom: 15px;
		}
		.pager {
			text-align: center;
			padding: 30px 0 10px;
		}
	</style>
	<body>
		<div id="app">
			<div class="center-wrapper">
				<div class="left-menu">
					<ul class="layui-nav layui-nav-tree">
						<li v-for="(item,index) in centerMenu" v-bind:key="index" class="layui-nav-item" :class="isCurrentMenu(item.url)?'layui-this':''">
							<a :href="item.url" @click.prevent="jump(item.url)">{{item.name}}</a>
						</li>
					</ul>
				</div>
				<div class="right-content">
					<div class="page-title">我的收藏</div>
					<div v-if="dataList.length === 0" class="empty-tip">
						<div class="layui-icon">&#xe67c;</div>
						<p>暂无收藏内容</p>
					</div>
					<div v-else class="collection-list">
						<div v-for="(item,index) in dataList" :key="index" @click="jump('../'+item.tablename+'/detail.html?id='+item.refid+'&embedded=true')" class="collection-item">
							<img :src="item.picture || '../../img/avator.png'">
							<div class="info">
								<div class="name">{{item.name}}</div>
								<div class="time">收藏时间：{{item.addtime}}</div>
								<button @click.stop="deleteStoreup(item.id)" class="delete-btn">删除</button>
							</div>
						</div>
					</div>
					<div class="pager" id="pager"></div>
				</div>
			</div>
		</div>

		<script src="../../layui/layui.js"></script>
		<script src="../../js/vue.js"></script>
		<script src="../../js/config.js"></script>
		<script src="../../modules/config.js"></script>
		<script src="../../js/utils.js"></script>

		<script>
			var vue = new Vue({
				el: '#app',
				data: {
					dataList: [],
					centerMenu: centerMenu()
				},
				methods: {
				jump(url) {
					jump(url)
				},
				isCurrentMenu(url) {
					var currentPath = window.location.pathname;
					var menuPath = url.replace('../', '');
					return currentPath.includes(menuPath);
				},
				deleteStoreup(id) {
					var _this = this;
					layui.layer.confirm('确定删除该收藏吗？', function(index) {
						layui.http.requestJson('storeup/delete', 'post', JSON.stringify([id]), function(res) {
							layui.layer.msg('删除成功', { icon: 6 });
							pageList();
						});
						layui.layer.close(index);
					});
				}
			}
			});

			layui.use(['layer', 'http', 'jquery', 'laypage'], function() {
				var layer = layui.layer;
				var http = layui.http;
				var jquery = layui.jquery;
				var laypage = layui.laypage;

				var limit = 9;

				pageList();

				function pageList() {
					var param = {
						page: 1,
						limit: limit,
						userid: localStorage.getItem('userid')
					}
					http.request('storeup/list', 'get', param, function(res) {
						vue.dataList = res.data.list || [];
						laypage.render({
							elem: 'pager',
							count: res.data.total || 0,
							limit: limit,
							groups: 5,
							layout: ["prev", "page", "next"],
							theme: '#ff9900',
							jump: function(obj, first) {
								if (!first) {
									param.page = obj.curr;
									http.request('storeup/list', 'get', param, function(res) {
										vue.dataList = res.data.list || [];
									})
								}
							}
						});
					})
				}
			});
		</script>
	</body>
</html>
