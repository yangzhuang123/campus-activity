
<!-- 个人中心 -->
<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
		<title>个人中心</title>
		<link rel="stylesheet" href="../../layui/css/layui.css">
		<link rel="stylesheet" href="../../css/style.css" />
		<link rel="stylesheet" href="../../css/theme.css" />
		<link rel="stylesheet" href="../../css/common.css" />
	</head>
	<style>
		.center-wrapper {
			display: flex;
			min-height: 500px;
		}
		.left-menu {
			width: 180px;
			background: #f5f5f5;
			border-right: 1px solid #eee;
			flex-shrink: 0;
		}
		.left-menu .layui-nav-tree {
			width: 100%;
		}
		.left-menu .layui-nav {
			position: relative;
			background: transparent;
		}
		.left-menu .layui-nav-item {
			height: 48px;
			line-height: 48px;
			font-size: 14px;
			color: #333;
		}
		.left-menu .layui-nav-item a {
			color: #333;
			padding: 0 20px;
		}
		.left-menu .layui-nav-item.layui-this,
		.left-menu .layui-nav-item:hover {
			background: #36b468;
			color: #fff;
		}
		.left-menu .layui-nav-item.layui-this a,
		.left-menu .layui-nav-item:hover a {
			color: #fff;
		}
		.right-content {
			flex: 1;
			padding: 30px 40px;
			min-height: 500px;
		}
		.page-title {
			font-size: 18px;
			font-weight: 600;
			color: #333;
			margin-bottom: 25px;
			padding-bottom: 15px;
			border-bottom: 2px solid #36b468;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}
		.notify-icon {
			position: relative;
			width: 36px;
			height: 36px;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			border-radius: 50%;
			background: #f5f5f5;
			transition: all 0.3s;
		}
		.notify-icon:hover {
			background: #e8f8f0;
		}
		.notify-icon .layui-icon {
			font-size: 20px;
			color: #666;
		}
		.notify-badge {
			position: absolute;
			top: -4px;
			right: -4px;
			min-width: 18px;
			height: 18px;
			line-height: 18px;
			text-align: center;
			background: #36b468;
			color: #fff;
			border-radius: 9px;
			font-size: 11px;
			padding: 0 5px;
		}
		.notify-dropdown {
			position: absolute;
			top: 50px;
			right: 0;
			width: 320px;
			background: #fff;
			border-radius: 8px;
			box-shadow: 0 4px 20px rgba(0,0,0,0.15);
			z-index: 1000;
			display: none;
		}
		.notify-dropdown.show {
			display: block;
		}
		.notify-dropdown .notify-header {
			padding: 12px 15px;
			border-bottom: 1px solid #eee;
			font-size: 14px;
			font-weight: 600;
			color: #333;
		}
		.notify-dropdown .notify-list {
			max-height: 300px;
			overflow-y: auto;
		}
		.notify-dropdown .notify-item {
			padding: 12px 15px;
			border-bottom: 1px solid #f5f5f5;
			cursor: pointer;
			transition: background 0.2s;
		}
		.notify-dropdown .notify-item:hover {
			background: #fafafa;
		}
		.notify-dropdown .notify-item.unread {
			background: #e8f8f0;
		}
		.notify-dropdown .notify-item .notify-title {
			font-size: 13px;
			color: #333;
			margin-bottom: 4px;
		}
		.notify-dropdown .notify-item .notify-content {
			font-size: 12px;
			color: #999;
			margin-bottom: 4px;
		}
		.notify-dropdown .notify-item .notify-time {
			font-size: 11px;
			color: #bbb;
		}
		.notify-dropdown .notify-footer {
			padding: 10px 15px;
			text-align: center;
			border-top: 1px solid #eee;
		}
		.notify-dropdown .notify-footer a {
			font-size: 13px;
			color: #36b468;
		}
		.notify-empty {
			padding: 30px 15px;
			text-align: center;
			color: #999;
			font-size: 13px;
		}
		.form-item {
			margin-bottom: 18px;
			display: flex;
			align-items: center;
		}
		.form-item label {
			width: 90px;
			font-size: 14px;
			color: #666;
			text-align: right;
			padding-right: 15px;
		}
		.form-item .input {
			flex: 1;
		}
		.form-item input,
		.form-item select {
			width: 100%;
			height: 38px;
			border: 1px solid #ddd;
			border-radius: 4px;
			padding: 0 12px;
			font-size: 14px;
		}
		.form-item input:focus,
		.form-item select:focus {
			border-color: #36b468;
			outline: none;
		}
		.btn-group {
			display: flex;
			gap: 15px;
			margin-top: 30px;
			padding-top: 20px;
			border-top: 1px solid #eee;
		}
		.btn {
			padding: 0 30px;
			height: 40px;
			line-height: 40px;
			border-radius: 4px;
			font-size: 14px;
			cursor: pointer;
			border: none;
		}
		.btn-primary {
			background: #36b468;
			color: #fff;
		}
		.btn-primary:hover {
			background: #47c07a;
		}
		.btn-default {
			background: #fff;
			color: #36b468;
			border: 1px solid #36b468;
		}
		.btn-default:hover {
			background: #e8f8f0;
		}
	</style>
	<body>

		<div id="app">
			<div class="center-wrapper">
			<div class="left-menu">
				<ul class="layui-nav layui-nav-tree">
					<li v-for="(item,index) in centerMenu" v-bind:key="index" class="layui-nav-item" :class="isCurrentMenu(item.url)?'layui-this':''">
						<a :href="item.url" @click.prevent="jump(item.url)">{{item.name}}</a>
					</li>
				</ul>
			</div>
			<div class="right-content">
				<div class="page-title">
					个人信息
					<div class="notify-wrapper" style="position: relative;">
						<div class="notify-icon" @click="toggleNotify">
							<i class="layui-icon layui-icon-notify"></i>
							<span v-if="unreadCount > 0" class="notify-badge">{{unreadCount > 99 ? '99+' : unreadCount}}</span>
						</div>
						<div class="notify-dropdown" :class="{'show': showNotify}">
							<div class="notify-header">消息通知</div>
							<div class="notify-list" v-if="notifyList.length > 0">
								<div v-for="(item,index) in notifyList" :key="index" class="notify-item" :class="{'unread': item.yuedu === 0}" @click="goToNotify(item)">
									<div class="notify-title">{{item.xiaoxibiaoti}}</div>
									<div class="notify-content">{{item.xiaoxineirong}}</div>
									<div class="notify-time">{{formatDate(item.fabushijian)}}</div>
								</div>
							</div>
							<div v-else class="notify-empty">暂无消息通知</div>
							<div class="notify-footer">
								<a href="../xiaoxi/list.html">查看全部</a>
							</div>
						</div>
					</div>
				</div>
				<form class="layui-form" lay-filter="myForm">
					<input type="hidden" name="id" id="id" />
					<div class="form-item">
						<label>学号</label>
						<div class="input">
							<input type="text" readonly name="xuehao" id="xuehao" class="layui-input">
						</div>
					</div>
					<div class="form-item">
						<label>密码</label>
						<div class="input">
							<input type="password" name="mima" id="mima" class="layui-input">
						</div>
					</div>
					<div class="form-item">
						<label>姓名</label>
						<div class="input">
							<input type="text" name="xueshengxingming" id="xueshengxingming" class="layui-input">
						</div>
					</div>
					<div class="form-item">
						<label>性别</label>
						<div class="input">
							<select name="xingbie" id="xingbie" class="layui-input">
								<option value="">请选择</option>
								<option v-for="(item,index) in xingbie" v-bind:key="index" :value="item">{{item}}</option>
							</select>
						</div>
					</div>
					<div class="form-item">
						<label>头像</label>
						<div class="input">
							<img id="touxiangImg" src="../../img/avator.png" style="width:80px;height:80px;border-radius:50%;border:2px solid #eee;">
							<input type="hidden" id="touxiang" name="touxiang" />
						</div>
					</div>
					<div class="form-item">
						<label></label>
						<div class="input">
							<button type="button" class="layui-btn" id="touxiangUpload"><i class="layui-icon">&#xe67c;</i>上传图片</button>
						</div>
					</div>
					<div class="form-item">
						<label>学院</label>
						<div class="input">
							<input type="text" name="xueyuan" id="xueyuan" class="layui-input">
						</div>
					</div>
					<div class="form-item">
						<label>班级</label>
						<div class="input">
							<input type="text" name="banji" id="banji" class="layui-input">
						</div>
					</div>
					<div class="form-item">
						<label>手机</label>
						<div class="input">
							<input type="text" name="shouji" id="shouji" class="layui-input">
						</div>
					</div>
					<div class="btn-group">
						<button type="button" class="btn btn-primary" lay-submit lay-filter="*">更新信息</button>
						<button type="button" class="btn btn-default" @click="logout">退出登录</button>
					</div>
				</form>
			</div>
		</div>

		</div>

		<script src="../../layui/layui.js"></script>
		<script src="../../js/vue.js"></script>
		<script src="../../js/config.js"></script>
		<script src="../../modules/config.js"></script>
		<script src="../../js/utils.js"></script>
		<script src="../../js/validate.js"></script>

		<script>
			var vue = new Vue({
				el: '#app',
				data: {
					swiperList: [],
					xingbie: [],
					centerMenu: centerMenu(),
					notifyList: [],
					unreadCount: 0,
					showNotify: false
				},
                updated: function() {
					layui.form.render(null, 'myForm');
				},
				methods: {
				jump(url) {
					jump(url)
				},
				isCurrentMenu(url) {
					var currentPath = window.location.pathname;
					var menuPath = url.replace('../', '');
					return currentPath.includes(menuPath);
				},
				logout(){
					localStorage.removeItem('Token');
					localStorage.removeItem('role');
					localStorage.removeItem('sessionTable');
					localStorage.removeItem('adminName');
					localStorage.removeItem('userid');
					localStorage.removeItem('userTable');
					localStorage.removeItem('iframeUrl');
					window.parent.location.href = '../login/login.html';
				},
					toggleNotify() {
						this.showNotify = !this.showNotify;
						if (this.showNotify && this.notifyList.length === 0) {
							this.loadNotify();
						}
					},
					loadNotify() {
							var userTable = localStorage.getItem('userTable');
							var username = localStorage.getItem('adminName');
							if (!userTable || !username) return;

						layui.http.request('xiaoxi/list', 'get', {
							page: 1,
							limit: 5,
							yonghu: username,
							yonghutable: userTable,
							sort: 'fabushijian',
							order: 'desc'
						}, function(res) {
							if (res.code === 0) {
								vue.notifyList = res.data.list || [];
								vue.unreadCount = vue.notifyList.filter(function(item) {
									return item.yuedu === '否';
								}).length;
							}
						});
					},
					formatDate(dateStr) {
						if (!dateStr) return '';
						var date = new Date(dateStr);
						var year = date.getFullYear();
						var month = String(date.getMonth() + 1).padStart(2, '0');
						var day = String(date.getDate()).padStart(2, '0');
						var hours = String(date.getHours()).padStart(2, '0');
						var minutes = String(date.getMinutes()).padStart(2, '0');
						return year + '-' + month + '-' + day + ' ' + hours + ':' + minutes;
					},
					goToNotify(item) {
						if (item.yuedu === '否') {
							layui.http.request('xiaoxi/read/' + item.id, 'get', {}, function(res) {
								vue.loadNotify();
							});
						}
						this.showNotify = false;
					}
				}
			})

			layui.use(['layer', 'element', 'carousel', 'http', 'jquery', 'form', 'upload'], function() {
				var layer = layui.layer;
				var element = layui.element;
				var carousel = layui.carousel;
				var http = layui.http;
				var jquery = layui.jquery;
				var form = layui.form;
				var upload = layui.upload;

				document.addEventListener('click', function(e) {
					var notifyWrapper = document.querySelector('.notify-wrapper');
					if (notifyWrapper && !notifyWrapper.contains(e.target)) {
						vue.showNotify = false;
					}
				});

				setTimeout(function() {
					vue.loadNotify();
				}, 500);

				vue.xingbie = '男,女'.split(',');

				var touxiangUpload = upload.render({
					elem: '#touxiangUpload',
					url: http.baseurl + 'file/upload',
					headers: {
						Token: localStorage.getItem('Token')
					},
					accept: 'images',
					before: function() {
						var index = layer.load(1, {
							shade: [0.1, '#fff']
						});
					},
					done: function(res) {
						layer.closeAll();
						if (res.code == 0) {
							layer.msg("上传成功", { time: 2000, icon: 6 })
							var url = http.baseurl + 'upload/' + res.file;
							jquery('#touxiang').val(url);
							jquery('#touxiangImg').attr('src', url)
						} else {
							layer.msg(res.msg, { time: 2000, icon: 5 })
						}
					},
					error: function() {
						layer.closeAll();
						layer.msg("请求接口异常", { time: 2000, icon: 5 })
					}
				});

				let table = localStorage.getItem("userTable");
				if(!table){
					layer.msg('请先登录', { time: 2000, icon: 5 }, function() {
						window.parent.location.href = '../login/login.html';
					});
				}

				http.request(`${table}/session`, 'get', {}, function(data) {
					form.val("myForm", data.data);
					jquery("#touxiangImg").attr("src", data.data.touxiang);
				});

				form.on('submit(*)', function(data) {
					data = data.field;
					if(!data.xuehao){
						layer.msg('学号不能为空', { time: 2000, icon: 5 });
						return false
					}
					if(!data.mima){
						layer.msg('密码不能为空', { time: 2000, icon: 5 });
						return false
					}
					if(!isMobile(data.shouji)){
						layer.msg('手机应输入手机格式', { time: 2000, icon: 5 });
						return false
					}
					http.requestJson(table + '/update', 'post', data, function(res) {
						layer.msg('修改成功', { time: 2000, icon: 6 }, function() {
							window.location.reload();
						});
					});
					return false
				});

			});
		</script>
	</body>
</html>
