<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>报名审核</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <style>
        .center-wrapper {
            display: flex;
            min-height: 500px;
        }
        .left-menu {
            width: 180px;
            background: #f5f5f5;
            border-right: 1px solid #eee;
            flex-shrink: 0;
        }
        .left-menu .layui-nav-tree {
            width: 100%;
        }
        .left-menu .layui-nav {
            position: relative;
            background: transparent;
        }
        .left-menu .layui-nav-item {
            height: 48px;
            line-height: 48px;
            font-size: 14px;
            color: #333;
        }
        .left-menu .layui-nav-item a {
            color: #333;
            padding: 0 20px;
        }
        .left-menu .layui-nav-item.layui-this,
        .left-menu .layui-nav-item:hover {
            background: #ff6600;
            color: #fff;
        }
        .left-menu .layui-nav-item.layui-this a,
        .left-menu .layui-nav-item:hover a {
            color: #fff;
        }
        .right-content {
            flex: 1;
            padding: 30px 40px;
            min-height: 500px;
        }
        .page-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #ff6600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .filter-select {
            padding: 8px 12px;
            border: 1px solid #eee;
            border-radius: 4px;
            font-size: 14px;
            min-width: 150px;
        }
        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #ff6600;
            border-radius: 4px;
            font-size: 14px;
            background: #ff6600;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }
        .filter-btn:hover {
            background: #ff8533;
        }
        .activity-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .activity-item {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: all 0.3s;
        }
        .activity-item:hover {
            box-shadow: 0 4px 16px rgba(255,102,0,0.2);
            transform: translateY(-2px);
        }
        .activity-item img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }
        .activity-item .info {
            padding: 15px;
        }
        .activity-item .info .title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .activity-item .info .meta {
            font-size: 12px;
            color: #999;
            margin-bottom: 6px;
        }
        .activity-item .info .status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 5px;
        }
        .activity-item .info .status.pending {
            background: #fff8e8;
            color: #ff9900;
        }
        .activity-item .info .status.approved {
            background: #e8f8f0;
            color: #36b468;
        }
        .activity-item .info .status.rejected {
            background: #fef0f0;
            color: #d9534f;
        }
        .activity-item .info .stats {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
        }
        .activity-item .actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
        }
        .activity-item .actions .btn {
            flex: 1;
            padding: 6px 0;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid #ff6600;
            background: #fff;
            color: #ff6600;
            text-align: center;
        }
        .activity-item .actions .btn:hover {
            background: #ff6600;
            color: #fff;
        }
        .activity-item .actions .btn.approve {
            border-color: #36b468;
            color: #36b468;
        }
        .activity-item .actions .btn.approve:hover {
            background: #36b468;
            color: #fff;
        }
        .activity-item .actions .btn.reject {
            border-color: #d9534f;
            color: #d9534f;
        }
        .activity-item .actions .btn.reject:hover {
            background: #d9534f;
            color: #fff;
        }
        .activity-item .actions .btn.disabled {
            border-color: #ccc;
            color: #ccc;
            cursor: not-allowed;
        }
        .activity-item .actions .btn.disabled:hover {
            background: #fff;
            color: #ccc;
        }
        .empty-tip {
            text-align: center;
            padding: 80px 0;
            color: #999;
            font-size: 14px;
        }
        .empty-tip .layui-icon {
            font-size: 48px;
            color: #ddd;
            margin-bottom: 15px;
        }
        .pager {
            text-align: center;
            padding: 30px 0 10px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="center-wrapper">
            <div class="left-menu">
                    <ul class="layui-nav layui-nav-tree">
                        <li v-for="(item,index) in centerMenu" v-bind:key="index" class="layui-nav-item" :class="isCurrentMenu(item.url)?'layui-this':''">
                            <a :href="item.url" @click.prevent="jump(item.url)">{{item.name}}</a>
                        </li>
                    </ul>
                </div>
            <div class="right-content">
                <div class="page-title">
                    <span>报名审核</span>
                </div>
                <div class="filter-bar">
                    <select class="filter-select" v-model="filterActivityTitle">
                        <option value="">全部活动</option>
                        <option v-for="activity in activityList" :key="activity.id" :value="activity.biaoti">{{activity.biaoti}}</option>
                    </select>
                    <select class="filter-select" v-model="filterStatus">
                        <option value="">全部状态</option>
                        <option value="pending">审核中</option>
                        <option value="approved">已通过</option>
                        <option value="rejected">已拒绝</option>
                    </select>
                    <button class="filter-btn" @click="filterData">查询</button>
                </div>
                <div v-if="dataList.length === 0" class="empty-tip">
                    <div class="layui-icon">&#xe6c6;</div>
                    <p>暂无报名记录</p>
                </div>
                <div v-else class="activity-list">
                    <div v-for="(item,index) in dataList" :key="index" class="activity-item">
                        <img :src="item.huodongtupian || '../../img/avator.png'">
                        <div class="info">
                            <div class="title">{{item.biaoti || '活动'}}</div>
                            <div class="meta">
                                <span>学生：{{item.xueshengxingming || '暂无'}}</span>
                            </div>
                            <div class="meta">
                                <span>学号：{{item.xuehao || '暂无'}}</span>
                            </div>
                            <div class="meta">
                                <span>手机：{{item.shouji || '暂无'}}</span>
                            </div>
                            <div class="meta">
                                <span>报名：{{item.baomingriqi ? String(item.baomingriqi).split(' ')[0] : '暂无'}}</span>
                            </div>
                            <div>
                                <span class="status" :class="getStatusClass(item.sfsh)">{{getStatusText(item.sfsh)}}</span>
                            </div>
                            <div v-if="item.shhf" class="stats">
                                <span>回复：{{item.shhf}}</span>
                            </div>
                            <div class="actions">
                                <button v-if="canApprove(item)" class="btn approve" @click="approve(item.id)">通过</button>
                                <button v-if="canReject(item)" class="btn reject" @click="reject(item.id)">拒绝</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="pager" id="pager"></div>
            </div>
        </div>
    </div>

    <script src="../../layui/layui.js"></script>
    <script src="../../js/vue.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../modules/config.js"></script>
    <script src="../../js/utils.js"></script>

    <script>
        var vue = new Vue({
            el: '#app',
            data: {
                dataList: [],
                activityList: [],
                centerMenu: centerMenu(),
                filterActivityTitle: '',
                filterStatus: ''
            },
            methods: {
                jump(url) {
                    jump(url)
                },
                isCurrentMenu(url) {
                    var currentPath = window.location.pathname;
                    var menuPath = url.replace('../', '');
                    return currentPath.includes(menuPath);
                },
                getStatusClass(status) {
                    if (status === '是') return 'approved';
                    if (status === '否') return 'rejected';
                    return 'pending';
                },
                getStatusText(status) {
                    if (status === '是') return '已通过';
                    if (status === '否') return '已拒绝';
                    return '审核中';
                },
                canApprove(item) {
                    return item.sfsh !== '是' && item.sfsh !== '否';
                },
                canReject(item) {
                    return item.sfsh !== '是' && item.sfsh !== '否';
                },
                approve(id) {
                    var _this = this;
                    layui.layer.prompt({title: '请输入审核回复', formType: 0}, function(text, index) {
                        layui.http.requestJson('huodongbaoming/update', 'post', {
                            id: id,
                            sfsh: '是',
                            shhf: text || ''
                        }, function(res) {
                            if (res.code === 0) {
                                layui.layer.msg('审核通过', {icon: 6}, function() {
                                    pageList();
                                });
                            } else {
                                layui.layer.msg('操作失败: ' + (res.msg || '未知错误'), {icon: 5});
                            }
                        }, function(error) {
                            layui.layer.msg('操作失败', {icon: 5});
                        });
                        layui.layer.close(index);
                    });
                },
                reject(id) {
                    var _this = this;
                    layui.layer.prompt({title: '请输入审核回复', formType: 0}, function(text, index) {
                        layui.http.requestJson('huodongbaoming/update', 'post', {
                            id: id,
                            sfsh: '否',
                            shhf: text || ''
                        }, function(res) {
                            if (res.code === 0) {
                                layui.layer.msg('已拒绝', {icon: 6}, function() {
                                    pageList();
                                });
                            } else {
                                layui.layer.msg('操作失败: ' + (res.msg || '未知错误'), {icon: 5});
                            }
                        }, function(error) {
                            layui.layer.msg('操作失败', {icon: 5});
                        });
                        layui.layer.close(index);
                    });
                },
                filterData() {
                    pageList();
                },
                loadActivityList() {
                    var userTable = localStorage.getItem('userTable');
                    var username = localStorage.getItem('adminName');
                    
                    if (userTable === 'shezhang') {
                        layui.http.request('shetuanhuodong/lists', 'get', {
                            zhanghao: username,
                            limit: 1000
                        }, function(res) {
                            if (res.code === 0) {
                                vue.activityList = res.data.list || [];
                            }
                        });
                    }
                }
            }
        });

        var pageList;

        layui.use(['layer', 'http', 'jquery', 'laypage'], function() {
            var layer = layui.layer;
            var http = layui.http;
            var jquery = layui.jquery;
            var laypage = layui.laypage;

            var limit = 9;

            var activityId = http.getParam('activityId');
            if (activityId) {
                // 查找对应的活动标题
                for (var i = 0; i < vue.activityList.length; i++) {
                    if (vue.activityList[i].id == activityId) {
                        vue.filterActivityTitle = vue.activityList[i].biaoti;
                        break;
                    }
                }
            }
            vue.loadActivityList();

            pageList = function() {
                var userTable = localStorage.getItem('userTable');
                var userid = localStorage.getItem('userid');
                var username = localStorage.getItem('adminName');

                if (!userTable || userTable !== 'shezhang') {
                    layer.msg('请先登录社长账号', {icon: 5});
                    window.location.href = '../login/login.html';
                    return;
                }

                if (!userid) {
                    layer.msg('登录信息异常，请重新登录', {icon: 5});
                    window.location.href = '../login/login.html';
                    return;
                }

                var param = {
                    page: 1,
                    limit: limit,
                    sort: 'addtime',
                    order: 'desc',
                    zhanghao: username
                };

                // 添加筛选条件
                if (vue.filterActivityTitle) {
                    param.biaoti = vue.filterActivityTitle;
                }
                if (vue.filterStatus === 'pending') {
                    param.sfsh = 'isNull';
                } else if (vue.filterStatus === 'approved') {
                    param.sfsh = '是';
                } else if (vue.filterStatus === 'rejected') {
                    param.sfsh = '否';
                }

                http.request('huodongbaoming/lists', 'get', param, function(res) {
                    if (res.code === 0) {
                        vue.dataList = res.data.list || [];
                        laypage.render({
                            elem: 'pager',
                            count: res.data.total || 0,
                            limit: limit,
                            groups: 5,
                            layout: ["prev", "page", "next"],
                            theme: '#FF9900',
                            jump: function(obj, first) {
                                if (!first) {
                                    param.page = obj.curr;
                                    http.request('huodongbaoming/lists', 'get', param, function(res) {
                                        if (res.code === 0) {
                                            vue.dataList = res.data.list || [];
                                        } else {
                                            layer.msg('获取数据失败: ' + (res.msg || '未知错误'), {icon: 5});
                                        }
                                    }, function(error) {
                                        layer.msg('网络错误，请稍后重试', {icon: 5});
                                    });
                                }
                            }
                        });
                    } else {
                        layer.msg('获取数据失败: ' + (res.msg || '未知错误'), {icon: 5});
                    }
                }, function(error) {
                    layer.msg('网络错误，请稍后重试', {icon: 5});
                });
            };

            pageList();
        });
    </script>
</body>
</html>
