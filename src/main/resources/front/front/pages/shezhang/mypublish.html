<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>我的发布</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <style>
        .center-wrapper {
            display: flex;
            min-height: 500px;
        }
        .left-menu {
            width: 180px;
            background: #f5f5f5;
            border-right: 1px solid #eee;
            flex-shrink: 0;
        }
        .left-menu .layui-nav-tree {
            width: 100%;
        }
        .left-menu .layui-nav {
            position: relative;
            background: transparent;
        }
        .left-menu .layui-nav-item {
            height: 48px;
            line-height: 48px;
            font-size: 14px;
            color: #333;
        }
        .left-menu .layui-nav-item a {
            color: #333;
            padding: 0 20px;
        }
        .left-menu .layui-nav-item.layui-this,
        .left-menu .layui-nav-item:hover {
            background: #ff6600;
            color: #fff;
        }
        .left-menu .layui-nav-item.layui-this a,
        .left-menu .layui-nav-item:hover a {
            color: #fff;
        }
        .right-content {
            flex: 1;
            padding: 30px 40px;
            min-height: 500px;
        }
        .page-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #ff6600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .activity-list {
            width: 100%;
            overflow-x: auto;
        }
        .activity-list table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
        }
        .activity-list table thead {
            background: #fafafa;
        }
        .activity-list table thead th {
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ff6600;
            white-space: nowrap;
        }
        .activity-list table tbody td {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            color: #555;
            vertical-align: middle;
        }
        .activity-list table tbody tr:hover {
            background: #fff8f0;
        }
        .activity-list table tbody tr:last-child td {
            border-bottom: none;
        }
        .action-link {
            padding: 4px 14px;
            border-radius: 4px;
            font-size: 12px;
            border: 1px solid #ff9900;
            background: #fff;
            color: #ff9900;
            text-decoration: none;
            transition: all 0.2s;
            display: inline-block;
        }
        .action-link:hover {
            background: #ff9900;
            color: #fff;
        }
        .col-title { min-width: 160px; }
        .col-location { min-width: 120px; }
        .col-capacity { min-width: 60px; text-align: center; }
        .col-count { min-width: 60px; text-align: center; }
        .col-remain { min-width: 60px; text-align: center; }
        .col-date { min-width: 100px; }
        .col-action { min-width: 100px; text-align: center; }
        .empty-tip {
            text-align: center;
            padding: 80px 0;
            color: #999;
            font-size: 14px;
        }
        .empty-tip .layui-icon {
            font-size: 48px;
            color: #ddd;
            margin-bottom: 15px;
        }
        .pager {
            text-align: center;
            padding: 30px 0 10px;
        }
        .create-btn {
            background: #ff6600 !important;
            color: #fff !important;
            border: 2px solid #ff6600 !important;
            padding: 10px 24px !important;
            border-radius: 8px !important;
            font-size: 15px !important;
            font-weight: 700 !important;
            cursor: pointer !important;
            display: inline-block !important;
            z-index: 9999 !important;
            position: relative !important;
        }
        .create-btn:hover {
            background: #ff8533 !important;
            border-color: #ff8533 !important;
        }
        .tag-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            background: #fff8f0;
            color: #ff6600;
            border: 1px solid #ffdbb5;
            margin: 2px 4px 2px 0;
            white-space: nowrap;
        }
        .tag-badge:hover {
            background: #ff6600;
            color: #fff;
            border-color: #ff6600;
        }
        .col-tags { min-width: 140px; }
        .action-link + .action-link { margin-left: 6px; }
    </style>
</head>
<body>
    <div id="app">
        <div class="center-wrapper">
            <div class="left-menu">
                <ul class="layui-nav layui-nav-tree">
                    <li v-for="(item,index) in centerMenu" v-bind:key="index" class="layui-nav-item" :class="index==2?'layui-this':''">
                        <a :href="item.url" @click.prevent="jump(item.url)">{{item.name}}</a>
                    </li>
                </ul>
            </div>
            <div class="right-content">
                <div class="page-title">
                    <button class="create-btn" @click="goToCreate">创建活动</button>
                </div>
                <div v-if="dataList.length === 0" class="empty-tip">
                    <div class="layui-icon">&#xe6c6;</div>
                    <p>暂无发布的活动</p>
                </div>
                <div v-else class="activity-list">
                    <table>
                        <thead>
                            <tr>
                                <th class="col-title">活动名称</th>
                                <th class="col-tags">标签</th>
                                <th class="col-location">地点</th>
                                <th class="col-capacity">总名额</th>
                                <th class="col-count">已报名</th>
                                <th class="col-remain">剩余</th>
                                <th class="col-date">活动时间</th>
                                <th class="col-date">发布时间</th>
                                <th class="col-action">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="(item,index) in dataList" :key="index">
                                <td class="col-title"><strong>{{item.biaoti}}</strong></td>
                                <td class="col-tags">
                                    <span v-if="getActivityTags(item.id).length === 0" style="color:#ccc;">无</span>
                                    <span v-else>
                                        <span class="tag-badge" v-for="tag in getActivityTags(item.id)" :key="tag.id">{{tag.name}}</span>
                                    </span>
                                </td>
                                <td class="col-location">{{item.huodongdidian || '暂无'}}</td>
                                <td class="col-capacity">{{item.huodongrenshu || 0}}</td>
                                <td class="col-count">{{getRegisteredCount(item.biaoti)}}</td>
                                <td class="col-remain" :style="{color: getRemainColor(item)}">{{getRemaining(item)}}</td>
                                <td class="col-date">{{item.huodongshijian || '暂无'}}</td>
                                <td class="col-date">{{formatDate(item.addtime)}}</td>
                                <td class="col-action">
                                    <a :href="'../shezhang/huodong_edit.html?id=' + item.id" class="action-link">编辑</a>
                                    <a :href="'../shezhang/baomingreview.html?activityId=' + item.id" class="action-link">查看报名</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="pager" id="pager"></div>
            </div>
        </div>
    </div>

    <script src="../../layui/layui.js"></script>
    <script src="../../js/vue.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../modules/config.js"></script>
    <script src="../../js/utils.js"></script>

    <script>
        var vue = new Vue({
            el: '#app',
            data: {
                dataList: [],
                centerMenu: centerMenu(),
                registeredCount: {},
                activityTags: {}
            },
            methods: {
                jump(url) {
                    jump(url)
                },
                formatDate(date) {
                    if (!date) return '暂无';
                    var d = new Date(date);
                    var year = d.getFullYear();
                    var month = (d.getMonth() + 1).toString().padStart(2, '0');
                    var day = d.getDate().toString().padStart(2, '0');
                    var hours = d.getHours().toString().padStart(2, '0');
                    var minutes = d.getMinutes().toString().padStart(2, '0');
                    return year + '-' + month + '-' + day + ' ' + hours + ':' + minutes;
                },
                getRegisteredCount(title) {
                    return this.registeredCount[title] || 0;
                },
                getRemaining(item) {
                    var capacity = item.huodongrenshu || 0;
                    var count = this.getRegisteredCount(item.biaoti);
                    return Math.max(0, capacity - count);
                },
                getRemainColor(item) {
                    var capacity = item.huodongrenshu || 0;
                    var count = this.getRegisteredCount(item.biaoti);
                    var remain = capacity - count;
                    if (remain <= 0) return '#d9534f';
                    if (remain <= capacity * 0.2) return '#ff9900';
                    return '#52c41a';
                },
                getActivityTags(activityId) {
                    return this.activityTags[activityId] || [];
                },
                goToCreate() {
                    window.location.href = '../shezhang/huodong_add.html';
                }
            }
        });

        layui.use(['layer', 'http', 'jquery', 'laypage'], function() {
            var layer = layui.layer;
            var http = layui.http;
            var jquery = layui.jquery;
            var laypage = layui.laypage;

            var limit = 15;

            function loadRegisteredCounts(username) {
                http.request('huodongbaoming/lists', 'get', {
                    zhanghao: username,
                    sfsh: '是',
                    limit: 10000
                }, function(res) {
                    if (res.code === 0) {
                        var counts = {};
                        var list = res.data.list || [];
                        for (var i = 0; i < list.length; i++) {
                            var title = list[i].biaoti;
                            if (title) {
                                counts[title] = (counts[title] || 0) + 1;
                            }
                        }
                        vue.registeredCount = counts;
                    }
                });
            }

            function loadActivityTags(activities) {
                if (!activities || activities.length === 0) return;
                var loaded = 0;
                for (var i = 0; i < activities.length; i++) {
                    (function(activityId) {
                        http.request('shetuanhuodong/tags/' + activityId, 'get', {}, function(res) {
                            if (res && res.code === 0) {
                                vue.$set(vue.activityTags, activityId, res.data || []);
                            }
                        });
                    })(activities[i].id);
                }
            }

            function pageList() {
                var userTable = localStorage.getItem('userTable');
                var userid = localStorage.getItem('userid');
                var username = localStorage.getItem('adminName');

                if (!userTable || userTable !== 'shezhang') {
                    layer.msg('请先登录社长账号', {icon: 5});
                    window.location.href = '../login/login.html';
                    return;
                }

                if (!userid) {
                    layer.msg('登录信息异常，请重新登录', {icon: 5});
                    window.location.href = '../login/login.html';
                    return;
                }

                var param = {
                    page: 1,
                    limit: limit,
                    sort: 'addtime',
                    order: 'desc',
                    zhanghao: username
                };

                http.request('shetuanhuodong/lists', 'get', param, function(res) {
                    if (res.code === 0) {
                        vue.dataList = res.data.list || [];
                        loadRegisteredCounts(username);
                        loadActivityTags(vue.dataList);
                        laypage.render({
                            elem: 'pager',
                            count: res.data.total || 0,
                            limit: limit,
                            groups: 5,
                            layout: ["prev", "page", "next"],
                            theme: '#ff9900',
                            jump: function(obj, first) {
                                if (!first) {
                                    param.page = obj.curr;
                                    http.request('shetuanhuodong/lists', 'get', param, function(res) {
                                        if (res.code === 0) {
                                            vue.dataList = res.data.list || [];
                                            loadRegisteredCounts(username);
                                            loadActivityTags(vue.dataList);
                                        } else {
                                            layer.msg('获取数据失败: ' + (res.msg || '未知错误'), {icon: 5});
                                        }
                                    }, function(error) {
                                        layer.msg('网络错误，请稍后重试', {icon: 5});
                                    });
                                }
                            }
                        });
                    } else {
                        layer.msg('获取数据失败: ' + (res.msg || '未知错误'), {icon: 5});
                    }
                }, function(error) {
                    layer.msg('网络错误，请稍后重试', {icon: 5});
                });
            }

            pageList();
        });
    </script>
</body>
</html>
