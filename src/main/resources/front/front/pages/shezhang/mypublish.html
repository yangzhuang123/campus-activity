<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>我的发布</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <style>
        .center-wrapper {
            display: flex;
            min-height: 500px;
        }
        .left-menu {
            width: 180px;
            background: #f5f5f5;
            border-right: 1px solid #eee;
            flex-shrink: 0;
        }
        .left-menu .layui-nav-tree {
            width: 100%;
        }
        .left-menu .layui-nav {
            position: relative;
            background: transparent;
        }
        .left-menu .layui-nav-item {
            height: 48px;
            line-height: 48px;
            font-size: 14px;
            color: #333;
        }
        .left-menu .layui-nav-item a {
            color: #333;
            padding: 0 20px;
        }
        .left-menu .layui-nav-item.layui-this,
        .left-menu .layui-nav-item:hover {
            background: #ff6600;
            color: #fff;
        }
        .left-menu .layui-nav-item.layui-this a,
        .left-menu .layui-nav-item:hover a {
            color: #fff;
        }
        .right-content {
            flex: 1;
            padding: 30px 40px;
            min-height: 500px;
        }
        .page-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #ff6600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .activity-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .activity-item {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: all 0.3s;
        }
        .activity-item:hover {
            box-shadow: 0 4px 16px rgba(54,176,104,0.2);
            transform: translateY(-2px);
        }
        .activity-item img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }
        .activity-item .info {
            padding: 15px;
        }
        .activity-item .info .title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .activity-item .info .meta {
            font-size: 12px;
            color: #999;
            margin-bottom: 6px;
        }
        .activity-item .info .stats {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
        }
        .activity-item .actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
        }
        .activity-item .actions .btn {
            flex: 1;
            padding: 6px 0;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid #ff9900;
            background: #fff;
            color: #ff9900;
            text-align: center;
        }
        .activity-item .actions .btn:hover {
            background: #ff9900;
            color: #fff;
        }
        .empty-tip {
            text-align: center;
            padding: 80px 0;
            color: #999;
            font-size: 14px;
        }
        .empty-tip .layui-icon {
            font-size: 48px;
            color: #ddd;
            margin-bottom: 15px;
        }
        .pager {
            text-align: center;
            padding: 30px 0 10px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="center-wrapper">
            <div class="left-menu">
                <ul class="layui-nav layui-nav-tree">
                    <li v-for="(item,index) in centerMenu" v-bind:key="index" class="layui-nav-item" :class="index==2?'layui-this':''">
                        <a :href="item.url" @click.prevent="jump(item.url)">{{item.name}}</a>
                    </li>
                </ul>
            </div>
            <div class="right-content">
                <div class="page-title">
                    <span>我的发布</span>
                </div>
                <div v-if="dataList.length === 0" class="empty-tip">
                    <div class="layui-icon">&#xe6c6;</div>
                    <p>暂无发布的活动</p>
                </div>
                <div v-else class="activity-list">
                    <div v-for="(item,index) in dataList" :key="index" class="activity-item">
                        <img :src="item.huodongtupian || '../../img/avator.png'">
                        <div class="info">
                            <div class="title">{{item.biaoti}}</div>
                            <div class="meta">
                                <span>时间：{{item.huodongshijian}}</span>
                            </div>
                            <div class="meta">
                                <span>地点：{{item.huodongdidian}}</span>
                            </div>
                            <div class="meta">
                                <span>人数：{{item.huodongrenshu}}人</span>
                            </div>
                            <div class="stats">
                                <span>发布时间：{{formatDate(item.addtime)}}</span>
                            </div>
                            <div class="actions">
                                <a :href="'../shezhang/baomingreview.html?activityId=' + item.id" class="btn">查看报名</a>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="pager" id="pager"></div>
            </div>
        </div>
    </div>

    <script src="../../layui/layui.js"></script>
    <script src="../../js/vue.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../modules/config.js"></script>
    <script src="../../js/utils.js"></script>

    <script>
        var vue = new Vue({
            el: '#app',
            data: {
                dataList: [],
                centerMenu: centerMenu()
            },
            methods: {
                jump(url) {
                    jump(url)
                },
                formatDate(date) {
                    if (!date) return '暂无';
                    var d = new Date(date);
                    var year = d.getFullYear();
                    var month = (d.getMonth() + 1).toString().padStart(2, '0');
                    var day = d.getDate().toString().padStart(2, '0');
                    var hours = d.getHours().toString().padStart(2, '0');
                    var minutes = d.getMinutes().toString().padStart(2, '0');
                    return year + '-' + month + '-' + day + ' ' + hours + ':' + minutes;
                }
            }
        });

        layui.use(['layer', 'http', 'jquery', 'laypage'], function() {
            var layer = layui.layer;
            var http = layui.http;
            var jquery = layui.jquery;
            var laypage = layui.laypage;

            var limit = 9;

            function pageList() {
                var userTable = localStorage.getItem('userTable');
                var userid = localStorage.getItem('userid');
                var username = localStorage.getItem('adminName');

                if (!userTable || userTable !== 'shezhang') {
                    layer.msg('请先登录社长账号', {icon: 5});
                    window.location.href = '../login/login.html';
                    return;
                }

                if (!userid) {
                    layer.msg('登录信息异常，请重新登录', {icon: 5});
                    window.location.href = '../login/login.html';
                    return;
                }

                var param = {
                    page: 1,
                    limit: limit,
                    sort: 'addtime',
                    order: 'desc',
                    zhanghao: username
                };

                http.request('shetuanhuodong/lists', 'get', param, function(res) {
                    if (res.code === 0) {
                        vue.dataList = res.data.list || [];
                        laypage.render({
                            elem: 'pager',
                            count: res.data.total || 0,
                            limit: limit,
                            groups: 5,
                            layout: ["prev", "page", "next"],
                            theme: '#ff9900',
                            jump: function(obj, first) {
                                if (!first) {
                                    param.page = obj.curr;
                                    http.request('shetuanhuodong/lists', 'get', param, function(res) {
                                        if (res.code === 0) {
                                            vue.dataList = res.data.list || [];
                                        } else {
                                            layer.msg('获取数据失败: ' + (res.msg || '未知错误'), {icon: 5});
                                        }
                                    }, function(error) {
                                        layer.msg('网络错误，请稍后重试', {icon: 5});
                                    });
                                }
                            }
                        });
                    } else {
                        layer.msg('获取数据失败: ' + (res.msg || '未知错误'), {icon: 5});
                    }
                }, function(error) {
                    layer.msg('网络错误，请稍后重试', {icon: 5});
                });
            }

            pageList();
        });
    </script>
</body>
</html>
