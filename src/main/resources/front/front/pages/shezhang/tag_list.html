<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>标签管理</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <style>
        .center-wrapper {
            display: flex;
            min-height: 500px;
        }
        .left-menu {
            width: 180px;
            background: #f5f5f5;
            border-right: 1px solid #eee;
            flex-shrink: 0;
        }
        .left-menu .layui-nav-tree {
            width: 100%;
        }
        .left-menu .layui-nav {
            position: relative;
            background: transparent;
        }
        .left-menu .layui-nav-item {
            height: 48px;
            line-height: 48px;
            font-size: 14px;
            color: #333;
        }
        .left-menu .layui-nav-item a {
            color: #333;
            padding: 0 20px;
        }
        .left-menu .layui-nav-item.layui-this,
        .left-menu .layui-nav-item:hover {
            background: #ff6600;
            color: #fff;
        }
        .left-menu .layui-nav-item.layui-this a,
        .left-menu .layui-nav-item:hover a {
            color: #fff;
        }
        .right-content {
            flex: 1;
            padding: 30px 40px;
            min-height: 500px;
        }
        .page-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #ff6600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-input {
            padding: 8px 12px;
            border: 1px solid #eee;
            border-radius: 4px;
            font-size: 14px;
            min-width: 150px;
        }
        .filter-select {
            padding: 8px 12px;
            border: 1px solid #eee;
            border-radius: 4px;
            font-size: 14px;
            min-width: 130px;
        }
        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #ff6600;
            border-radius: 4px;
            font-size: 14px;
            background: #ff6600;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }
        .filter-btn:hover {
            background: #ff8533;
        }
        .create-btn {
            background: #ff6600 !important;
            color: #fff !important;
            border: 2px solid #ff6600 !important;
            padding: 10px 24px !important;
            border-radius: 8px !important;
            font-size: 15px !important;
            font-weight: 700 !important;
            cursor: pointer !important;
            display: inline-block !important;
            z-index: 9999 !important;
            position: relative !important;
        }
        .create-btn:hover {
            background: #ff8533 !important;
            border-color: #ff8533 !important;
        }
        .tag-list {
            width: 100%;
            overflow-x: auto;
        }
        .tag-list table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
        }
        .tag-list table thead {
            background: #fafafa;
        }
        .tag-list table thead th {
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ff6600;
            white-space: nowrap;
        }
        .tag-list table tbody td {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            color: #555;
            vertical-align: middle;
        }
        .tag-list table tbody tr:hover {
            background: #fff8f0;
        }
        .tag-list table tbody tr:last-child td {
            border-bottom: none;
        }
        .tag-type-tag {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .tag-type-tag.activity {
            background: #e8f0fe;
            color: #1a73e8;
        }
        .tag-type-tag.club {
            background: #e8f8f0;
            color: #52c41a;
        }
        .tag-status {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .tag-status.normal {
            background: #e8f8f0;
            color: #52c41a;
        }
        .tag-status.disabled {
            background: #fef0f0;
            color: #d9534f;
        }
        .action-btn {
            padding: 4px 14px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid #ff9900;
            background: #fff;
            color: #ff9900;
            margin-right: 6px;
            transition: all 0.2s;
        }
        .action-btn:hover {
            background: #ff9900;
            color: #fff;
        }
        .action-btn.danger {
            border-color: #d9534f;
            color: #d9534f;
        }
        .action-btn.danger:hover {
            background: #d9534f;
            color: #fff;
        }
        .col-name { min-width: 100px; }
        .col-type { min-width: 80px; }
        .col-sort { min-width: 60px; text-align: center; }
        .col-status { min-width: 60px; }
        .col-date { min-width: 140px; }
        .col-action { min-width: 100px; text-align: center; }
        .empty-tip {
            text-align: center;
            padding: 80px 0;
            color: #999;
            font-size: 14px;
        }
        .empty-tip .layui-icon {
            font-size: 48px;
            color: #ddd;
            margin-bottom: 15px;
        }
        .pager {
            text-align: center;
            padding: 30px 0 10px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="center-wrapper">
            <div class="left-menu">
                <ul class="layui-nav layui-nav-tree">
                    <li v-for="(item,index) in centerMenu" v-bind:key="index" class="layui-nav-item" :class="isCurrentMenu(item.url)?'layui-this':''">
                        <a :href="item.url" @click.prevent="jump(item.url)">{{item.name}}</a>
                    </li>
                </ul>
            </div>
            <div class="right-content">
                <div class="page-title">
                    <span>标签管理</span>
                    <button class="create-btn" @click="openAddDialog">新增标签</button>
                </div>
                <div class="filter-bar">
                    <input class="filter-input" v-model="filterName" placeholder="标签名称" @keyup.enter="search">
                    <select class="filter-select" v-model="filterType">
                        <option value="">全部类型</option>
                        <option value="活动标签">活动标签</option>
                        <option value="社团标签">社团标签</option>
                    </select>
                    <button class="filter-btn" @click="search">查询</button>
                </div>
                <div v-if="dataList.length === 0" class="empty-tip">
                    <div class="layui-icon">&#xe6c6;</div>
                    <p>暂无标签数据</p>
                </div>
                <div v-else class="tag-list">
                    <table>
                        <thead>
                            <tr>
                                <th class="col-name">标签名称</th>
                                <th class="col-type">标签类型</th>
                                <th class="col-sort">排序</th>
                                <th class="col-status">状态</th>
                                <th class="col-date">创建时间</th>
                                <th class="col-action">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="(item,index) in dataList" :key="index">
                                <td class="col-name"><strong>{{item.name}}</strong></td>
                                <td class="col-type">
                                    <span class="tag-type-tag" :class="item.type=='活动标签'?'activity':'club'">{{item.type}}</span>
                                </td>
                                <td class="col-sort">{{item.sort}}</td>
                                <td class="col-status">
                                    <span class="tag-status" :class="item.status=='正常'?'normal':'disabled'">{{item.status}}</span>
                                </td>
                                <td class="col-date">{{formatDate(item.createTime)}}</td>
                                <td class="col-action">
                                    <button class="action-btn" @click="openEditDialog(item)">编辑</button>
                                    <button class="action-btn danger" @click="deleteTag(item)">删除</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="pager" id="pager"></div>
            </div>
        </div>
    </div>

    <script src="../../layui/layui.js"></script>
    <script src="../../js/vue.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../modules/config.js"></script>
    <script src="../../js/utils.js"></script>

    <script>
        var vue = new Vue({
            el: '#app',
            data: {
                dataList: [],
                centerMenu: centerMenu(),
                filterName: '',
                filterType: ''
            },
            methods: {
                jump(url) {
                    jump(url)
                },
                isCurrentMenu(url) {
                    var currentPath = window.location.pathname;
                    var menuPath = url.replace('../', '');
                    return currentPath.includes(menuPath);
                },
                formatDate(date) {
                    if (!date) return '暂无';
                    var d = new Date(date);
                    var year = d.getFullYear();
                    var month = (d.getMonth() + 1).toString().padStart(2, '0');
                    var day = d.getDate().toString().padStart(2, '0');
                    var hours = d.getHours().toString().padStart(2, '0');
                    var minutes = d.getMinutes().toString().padStart(2, '0');
                    return year + '-' + month + '-' + day + ' ' + hours + ':' + minutes;
                },
                search() {
                    pageList();
                },
                openAddDialog() {
                    var _this = this;
                    var html = '<div style="padding:20px 30px;">' +
                        '<div style="margin-bottom:15px;">' +
                            '<label style="display:inline-block;width:80px;text-align:right;padding-right:10px;font-size:14px;color:#333;">标签名称</label>' +
                            '<input id="tagNameInput" class="layui-input" style="display:inline-block;width:220px;" placeholder="请输入标签名称">' +
                        '</div>' +
                        '<div style="margin-bottom:15px;">' +
                            '<label style="display:inline-block;width:80px;text-align:right;padding-right:10px;font-size:14px;color:#333;">标签类型</label>' +
                            '<select id="tagTypeSelect" class="layui-input" style="display:inline-block;width:220px;">' +
                                '<option value="活动标签">活动标签</option>' +
                                '<option value="社团标签">社团标签</option>' +
                            '</select>' +
                        '</div>' +
                        '<div style="margin-bottom:15px;">' +
                            '<label style="display:inline-block;width:80px;text-align:right;padding-right:10px;font-size:14px;color:#333;">排序</label>' +
                            '<input id="tagSortInput" class="layui-input" style="display:inline-block;width:220px;" placeholder="排序值（越小越靠前）" value="0">' +
                        '</div>' +
                    '</div>';
                    layer.open({
                        type: 1,
                        title: '新增标签',
                        area: ['450px', '320px'],
                        content: html,
                        btn: ['确定', '取消'],
                        yes: function(index) {
                            var name = document.getElementById('tagNameInput').value.trim();
                            var type = document.getElementById('tagTypeSelect').value;
                            var sort = document.getElementById('tagSortInput').value.trim();
                            if (!name) {
                                layer.msg('请输入标签名称', {icon: 5});
                                return;
                            }
                            if (!type) {
                                layer.msg('请选择标签类型', {icon: 5});
                                return;
                            }
                            var sortVal = parseInt(sort) || 0;
                            layui.http.requestJson('tag/save', 'post', {
                                name: name,
                                type: type,
                                sort: sortVal
                            }, function(res) {
                                if (res.code === 0) {
                                    layer.msg('新增成功', {icon: 6}, function() {
                                        layer.close(index);
                                        pageList();
                                    });
                                } else {
                                    layer.msg(res.msg || '新增失败', {icon: 5});
                                }
                            }, function(error) {
                                layer.msg('网络错误，请稍后重试', {icon: 5});
                            });
                        },
                        cancel: function(index) {
                            layer.close(index);
                        }
                    });
                },
                openEditDialog(item) {
                    var _this = this;
                    var html = '<div style="padding:20px 30px;">' +
                        '<div style="margin-bottom:15px;">' +
                            '<label style="display:inline-block;width:80px;text-align:right;padding-right:10px;font-size:14px;color:#333;">标签名称</label>' +
                            '<input id="tagNameInput" class="layui-input" style="display:inline-block;width:220px;" placeholder="请输入标签名称" value="' + item.name + '">' +
                        '</div>' +
                        '<div style="margin-bottom:15px;">' +
                            '<label style="display:inline-block;width:80px;text-align:right;padding-right:10px;font-size:14px;color:#333;">标签类型</label>' +
                            '<select id="tagTypeSelect" class="layui-input" style="display:inline-block;width:220px;">' +
                                '<option value="活动标签"' + (item.type=='活动标签'?' selected':'') + '>活动标签</option>' +
                                '<option value="社团标签"' + (item.type=='社团标签'?' selected':'') + '>社团标签</option>' +
                            '</select>' +
                        '</div>' +
                        '<div style="margin-bottom:15px;">' +
                            '<label style="display:inline-block;width:80px;text-align:right;padding-right:10px;font-size:14px;color:#333;">排序</label>' +
                            '<input id="tagSortInput" class="layui-input" style="display:inline-block;width:220px;" placeholder="排序值（越小越靠前）" value="' + (item.sort || 0) + '">' +
                        '</div>' +
                    '</div>';
                    layer.open({
                        type: 1,
                        title: '编辑标签',
                        area: ['450px', '320px'],
                        content: html,
                        btn: ['确定', '取消'],
                        yes: function(index) {
                            var name = document.getElementById('tagNameInput').value.trim();
                            var type = document.getElementById('tagTypeSelect').value;
                            var sort = document.getElementById('tagSortInput').value.trim();
                            if (!name) {
                                layer.msg('请输入标签名称', {icon: 5});
                                return;
                            }
                            if (!type) {
                                layer.msg('请选择标签类型', {icon: 5});
                                return;
                            }
                            var sortVal = parseInt(sort) || 0;
                            layui.http.requestJson('tag/update', 'post', {
                                id: item.id,
                                name: name,
                                type: type,
                                sort: sortVal
                            }, function(res) {
                                if (res.code === 0) {
                                    layer.msg('更新成功', {icon: 6}, function() {
                                        layer.close(index);
                                        pageList();
                                    });
                                } else {
                                    layer.msg(res.msg || '更新失败', {icon: 5});
                                }
                            }, function(error) {
                                layer.msg('网络错误，请稍后重试', {icon: 5});
                            });
                        },
                        cancel: function(index) {
                            layer.close(index);
                        }
                    });
                },
                deleteTag(item) {
                    layer.confirm('确定删除标签「' + item.name + '」吗？', {
                        btn: ['确定', '取消'],
                        title: '删除确认'
                    }, function(index) {
                        layui.http.requestJson('tag/delete', 'post', [item.id], function(res) {
                            if (res.code === 0) {
                                layer.msg('删除成功', {icon: 6}, function() {
                                    layer.close(index);
                                    pageList();
                                });
                            } else {
                                layer.msg(res.msg || '删除失败', {icon: 5});
                            }
                        }, function(error) {
                            layer.msg('网络错误，请稍后重试', {icon: 5});
                        });
                    });
                }
            }
        });

        var pageList;

        layui.use(['layer', 'http', 'jquery', 'laypage'], function() {
            var layer = layui.layer;
            var http = layui.http;
            var jquery = layui.jquery;
            var laypage = layui.laypage;

            var limit = 15;

            pageList = function() {
                var userTable = localStorage.getItem('userTable');
                var userid = localStorage.getItem('userid');

                if (!userTable || userTable !== 'shezhang') {
                    layer.msg('请先登录社长账号', {icon: 5});
                    window.location.href = '../login/login.html';
                    return;
                }

                if (!userid) {
                    layer.msg('登录信息异常，请重新登录', {icon: 5});
                    window.location.href = '../login/login.html';
                    return;
                }

                var param = {
                    page: 1,
                    limit: limit,
                    sort: 'sort',
                    order: 'asc'
                };

                if (vue.filterName) {
                    param.name = '%' + vue.filterName + '%';
                }
                if (vue.filterType) {
                    param.type = vue.filterType;
                }

                http.request('tag/page', 'get', param, function(res) {
                    if (res.code === 0) {
                        vue.dataList = res.data.list || [];
                        laypage.render({
                            elem: 'pager',
                            count: res.data.total || 0,
                            limit: limit,
                            groups: 5,
                            layout: ["prev", "page", "next"],
                            theme: '#ff6600',
                            jump: function(obj, first) {
                                if (!first) {
                                    param.page = obj.curr;
                                    http.request('tag/page', 'get', param, function(res) {
                                        if (res.code === 0) {
                                            vue.dataList = res.data.list || [];
                                        } else {
                                            layer.msg('获取数据失败: ' + (res.msg || '未知错误'), {icon: 5});
                                        }
                                    }, function(error) {
                                        layer.msg('网络错误，请稍后重试', {icon: 5});
                                    });
                                }
                            }
                        });
                    } else {
                        layer.msg('获取数据失败: ' + (res.msg || '未知错误'), {icon: 5});
                    }
                }, function(error) {
                    layer.msg('网络错误，请稍后重试', {icon: 5});
                });
            };

            pageList();
        });
    </script>
</body>
</html>
