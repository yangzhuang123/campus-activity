
<!DOCTYPE html>
<html>
<head lang="en">
<meta charset="utf-8">
<title>首页</title>
<meta name="description" content="" />
<meta name="keywords" content="" />
<meta name="author" content="order by mobanxiu.cn" />
<meta name="renderer" content="webkit">
<meta http-equiv="X-UA-Compatible" content="IE=edge"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../../layui/css/layui.css">
<link href="https://cdn.bootcdn.net/ajax/libs/Swiper/5.4.5/css/swiper.min.css" rel="stylesheet">
<link rel="stylesheet" href="../../xznstatic/css/common.css"/>
<link rel="stylesheet" href="../../xznstatic/css/style.css"/>
<script src="../../xznstatic/js/jquery-1.11.3.min.js"></script>
<script src="../../xznstatic/js/jquery.SuperSlide.2.1.1.js"></script>
</head>
<style>
	html::after {
		position: fixed;
		top: 0;
		right: 0;
		left: 0;
		bottom: 0;
		content: '';
		display: block;
		background-attachment: fixed;
		background-size: cover;
		background-position: center;
		z-index: -1;
	}
	#test1 {
		overflow: hidden;
	}
	#test1 .layui-carousel-ind li {
		width: 10px;
		height: 10px;
		border-width: 0;
		border-style: solid;
		border-color: rgba(255, 255, 255, 0.3);
		border-radius: 50%;
		background-color: rgba(255, 255, 255, 0.7);
		box-shadow: 0 0 0px rgba(255,0,0,.8);
	}
	#test1 .layui-carousel-ind li.layui-this {
		width: 10px;
		height: 10px;
		border-width: 0;
		border-style: solid;
		border-color: rgba(0,0,0,.3);
		border-radius: 50%;
		background-color: rgba(255, 153, 0, 1);
		box-shadow: 0 0 0px rgba(255,0,0,.8);
	}

	.banner {
		margin-top: 0;
	}

	.recommend {
		padding: 30px 0;
		display: flex;
		justify-content: center;
		background-color: #f8f9fa;
	}

	.recommend .box {
		width: 100%;
		max-width: 1200px;
		padding: 0 20px;
		box-sizing: border-box;
	}

	.recommend .box .title {
		padding: 20px 0 30px 0;
		display: flex;
		justify-content: center;
		align-items: center;
		flex-direction: column;
		text-align: center;
	}

	.recommend .box .title span {
		padding: 0 10px;
		line-height: 1.4;
	}

	.recommend .box .title span:first-child {
		font-size: 14px;
		color: #999;
		letter-spacing: 2px;
		text-transform: uppercase;
	}

	.recommend .box .title span:last-child {
		font-size: 28px;
		color: #333;
		font-weight: 600;
		margin-top: 8px;
	}

	.recommend .box .list {
		display: flex;
		flex-wrap: wrap;
		justify-content: flex-start;
		gap: 20px;
	}

	.recommend .box .list .list-item {
		flex: 0 0 calc(25% - 15px);
		padding: 0;
		box-sizing: border-box;
	}

	.recommend .box .list .list-item-body {
		background: #fff;
		border-radius: 12px;
		overflow: hidden;
		box-shadow: 0 2px 12px rgba(0,0,0,0.08);
		transition: all 0.3s ease;
		cursor: pointer;
	}

	.recommend .box .list .list-item-body:hover {
		transform: translateY(-5px);
		box-shadow: 0 8px 25px rgba(0,0,0,0.15);
	}

	.recommend .box .list img {
		width: 100%;
		height: 180px;
		display: block;
		object-fit: cover;
	}

	.recommend .box .list .activity-info {
		padding: 15px;
		background: #fff;
	}

	.recommend .box .list .activity-info .name {
		font-size: 16px;
		font-weight: 600;
		color: #333;
		margin-bottom: 10px;
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: nowrap;
	}

	.recommend .box .list .activity-info .info-item {
		font-size: 13px;
		color: #666;
		margin: 6px 0;
		display: flex;
		align-items: center;
	}

	.recommend .box .list .activity-info .info-item .label {
		color: #999;
		min-width: 60px;
	}

	.recommend .box .list .activity-info .quota {
		color: #ff6600;
		font-weight: 500;
	}

	.recommend .box .list .list-item3 {
		flex: 0 0 33.33%;
	}

	.recommend .box .list .list-item5 {
		flex: 0 0 20%;
	}

	.animation-box:hover {
		transform: translateY(-5px);
		transition: all 0.3s ease;
	}

	.view-more {
		text-align: center;
		margin-top: 30px;
	}

	.view-more button {
		display: inline-block;
		padding: 10px 30px;
		background: #fff;
		color: #ff9900;
		border: 1px solid #ff9900;
		border-radius: 25px;
		cursor: pointer;
		font-size: 14px;
		transition: all 0.3s ease;
	}

	.view-more button:hover {
		background: #ff9900;
		color: #fff;
	}

	.news {
		padding: 30px 0;
		display: flex;
		justify-content: center;
		background-color: #fff;
	}

	.news .box {
		width: 100%;
		max-width: 1200px;
	}

	.lists {
		padding: 30px 0;
		display: flex;
		justify-content: center;
		background-color: #f8f9fa;
	}

	.lists .box {
		width: 100%;
		max-width: 1200px;
		overflow: hidden;
	}

	.index-pv3 .box .list .list-item {
		flex: 0 0 25%;
		padding: 0;
		box-sizing: border-box;
	}

	#new-list-6 .swiper-wrapper {
		-webkit-transition-timing-function: linear;
		-moz-transition-timing-function: linear;
		-ms-transition-timing-function: linear;
		-o-transition-timing-function: linear;
		transition-timing-function: linear;
	}
</style>
<body>
  <div id="app">
    <div class="banner">
		<div class="layui-carousel" id="test1" :style='{"boxShadow":"0 0 0px rgba(255,0,0,.8)","margin":"0 auto","borderColor":"rgba(255, 255, 255, 0.3)","borderRadius":"0px","borderWidth":"0","width":"100%","borderStyle":"solid"}'>
		  <div carousel-item>
			<div v-for="(item,index) in swiperList" :key="index">
				<img style="width: 100%;height: 100%;object-fit:cover;" :src="item.img" />
			</div>
		  </div>
		</div>
      <!-- <div class="bd">
        <ul>
          <li v-for="(item,index) in swiperList" v-bind:key="index"><img style="width: 1920px;height: 492px;" :src="item.img" /></li>
        </ul>
        <div class="hd">
          <ul>
            <li v-for="(item,index) in swiperList" v-bind:key="index"></li>
          </ul>
        </div>
      </div> -->
    </div>


    <div id="content">
	<!-- 近期活动 -->
	<div class="recommend index-pv3" :style='{"padding":"30px 0","boxShadow":"0 0 0px rgba(255,0,0,0)","margin":"0","borderColor":"rgba(255, 255, 255, 0.3)","backgroundColor":"#f8f9fa","borderRadius":"0","borderWidth":"0","borderStyle":"solid"}'>
	  <div class="box" style='width:100%;max-width:1200px;padding:0 20px;box-sizing:border-box;'>
	    <div class="title">
	      <span>RECENT ACTIVITIES</span><span>近期活动</span>
	    </div>
	    <div class="list">
	      <div v-for="(item,index) in shetuanhuodongList" :key="index" @click="jump('../shetuanhuodong/detail.html?id='+item.id)" class="list-item" :class="4=='3'?'list-item3':4=='5'?'list-item5':''">
	        <div class="list-item-body animation-box">
				<img :src="item.huodongtupian?item.huodongtupian.split(',')[0]:''" alt="" />
				<div class="activity-info">
					<div class="name">{{item.biaoti}}</div>
					<div class="info-item"><span class="label">主办方：</span>{{item.shetuanmingcheng}}</div>
					<div class="info-item"><span class="label">时间：</span>{{formatDate(item.kaishishijian)}}</div>
					<div class="info-item quota"><span class="label">剩余名额：</span>{{item.huodongrenshu - (item.baomingrenshu || 0)}} / {{item.huodongrenshu}}</div>
				</div>
	        </div>
	      </div>
	    </div>
	    <div class="view-more">
			<button @click="jump('../shetuanhuodong/list.html')">查看更多 <i class="layui-icon layui-icon-next"></i></button>
	    </div>
	  </div>
	</div>

    </div>
  </div>

  <script src="../../layui/layui.js"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/Swiper/5.4.5/js/swiper.min.js"></script>
  <script src="../../js/vue.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../modules/config.js"></script>
  <script src="../../js/utils.js"></script>
  <script type="text/javascript">
    var vue = new Vue({
      el: '#app',
      data: {

        shetuanhuodongList: [],
        swiperList: []
      },
      methods: {
        jump(url) {
          	jump(url)
        },
        formatDate(date) {
          if (!date) return '';
          var d;
          if (typeof date === 'string') {
            d = new Date(date.replace(/-/g, '/'));
          } else {
            d = new Date(date);
          }
          if (isNaN(d.getTime())) return date;
          var year = d.getFullYear();
          var month = ('0' + (d.getMonth() + 1)).slice(-2);
          var day = ('0' + d.getDate()).slice(-2);
          var hours = ('0' + d.getHours()).slice(-2);
          var minutes = ('0' + d.getMinutes()).slice(-2);
          return year + '-' + month + '-' + day + ' ' + hours + ':' + minutes;
        },
      }
    });

    layui.use(['layer', 'form', 'element', 'carousel', 'http', 'jquery'], function() {
		var layer = layui.layer;
		var element = layui.element;
		var form = layui.form;
		var carousel = layui.carousel;
		var http = layui.http;
		var jquery = layui.jquery;

      // 获取轮播图 数据
      http.request('config/list', 'get', {
        page: 1,
        limit: 5
      }, function(res) {
        if (res.data.list.length > 0) {
          let swiperList = [];
          res.data.list.forEach(element => {
            if (element.value != null) {
              swiperList.push({
                img: element.value
              });
            }
          });

		  vue.swiperList = swiperList;

		  vue.$nextTick(() => {
		    carousel.render({
		    	elem: '#test1',
				width: '100%',
		    	height: '500px',
		    	arrow: 'hover',
		    	anim: 'default',
		    	autoplay: 'true',
		    	interval: '3000',
		    	indicator: 'inside'
		    });

		  })

          // vue.$nextTick(()=>{
          //   window.xznSlide();
          // });
        }
      });

      // 社团新闻
      http.request('news/list', 'get', {
        page: 1,
	limit: 3 * 2,
        order: 'desc'
      }, function(res) {
        var newsList = res.data.list;
		for(var i = 0; i<newsList.length; i++) {
			let d = newsList[i].addtime.split(' ')
			d = d[0].split('-')
			newsList[i].year = d[0]
			newsList[i].month = d[1] + '-' + d[2]
		}
		
        vue.newsList = newsList;
        if (newsList.length > 0 && newsList.length <= 2) {
          vue.leftNewsList = res.data.list
        } else {
          var leftNewsList = []
          for (let i = 0; i <= 2; i++) {
            leftNewsList.push(newsList[i]);
          }
          vue.leftNewsList = leftNewsList
        }
        if (newsList.length > 2 && newsList.length <= 8) {
          var rightNewsList = []
          for (let i = 3; i <= newsList.length; i++) {
            rightNewsList.push(newsList[i]);
          }
          vue.rightNewsList = rightNewsList
        }

		let flag = 1;
		let options = {"navigation":{"nextEl":".swiper-button-next","prevEl":".swiper-button-prev"},"slidesPerView":5,"loop":true,"spaceBetween":20,"autoplay":{"delay":3000,"disableOnInteraction":false}}
		options.pagination = {el:'null'}
		if(flag == 3) {
			vue.$nextTick(() => {
                                                                                                                                                                				new Swiper ('#newsnews', options)
                                			})
		}
		
		if(flag == 6) {
			let sixSwiper = {
				loop: true,
				speed: 2500,
				slidesPerView: 3,
				spaceBetween: 10,
				centeredSlides: true,
				watchSlidesProgress: true,
				autoplay: {
				  delay: 0,
				  stopOnLastSlide: false,
				  disableOnInteraction: false
				}
			}
			
			vue.$nextTick(() => {
				new Swiper('#new-list-6', sixSwiper)
			})
		}
      });

      // 获取推荐信息
      http.request(`shetuanxinxi/autoSort`, 'get', {
	sfsh: '是',
        page: 1,
	limit: 4 * 2
		}, function(res) {
			vue.shetuanxinxiRecommend = res.data.list
			let flag = 1;
			let options = {"navigation":{"nextEl":".swiper-button-next","prevEl":".swiper-button-prev"},"slidesPerView":5,"loop":true,"spaceBetween":20,"autoplay":{"delay":3000,"disableOnInteraction":false}}
			options.pagination = {el:'null'}
			if(flag == 3) {
				vue.$nextTick(() => {
																																														new Swiper ('#recommendshetuanxinxi', options)
																																																																																				})
			}
			
			// 商品推荐样式五
			if(flag == 5) {
				vue.$nextTick(() => {
					var swiper = new Swiper('#recommend-five-swiper', {
						loop: true,
						speed: 500,
						slidesPerView: 5,
						spaceBetween: 10,
						autoplay: {"delay":3000,"disableOnInteraction":false},
						centeredSlides: true,
						watchSlidesProgress: true,
						on: {
							setTranslate: function() {
								slides = this.slides
								for (i = 0; i < slides.length; i++) {
									slide = slides.eq(i)
									progress = slides[i].progress
									// slide.html(progress.toFixed(2)); //看清楚progress是怎么变化的
									slide.css({
										'opacity': '',
										'background': ''
									});
									slide.transform(''); //清除样式
					
									slide.transform('scale(' + (1.5 - Math.abs(progress) / 4) + ')');
								}
							},
							setTransition: function(transition) {
								for (var i = 0; i < this.slides.length; i++) {
									var slide = this.slides.eq(i)
									slide.transition(transition);
								}
							},
						},
						navigation: {"nextEl":".swiper-button-next","prevEl":".swiper-button-prev"},
						pagination: {"el":".swiper-pagination","clickable":true},
					});
				})
			}
		});

      http.request(`shetuanhuodong/list`, 'get', {
	sfsh: '是',
        page: 1,
	limit: 4 * 1
      }, function(res) {
        vue.shetuanhuodongList = res.data.list;
		let flag = 1;
		let options = {"navigation":{"nextEl":".swiper-button-next","prevEl":".swiper-button-prev"},"slidesPerView":"4","loop":true,"spaceBetween":"30","autoplay":{"delay":3000,"disableOnInteraction":false}}
		options.pagination = {el:'null'}
		if(flag == 3) {
			vue.$nextTick(() => {
                                                                                                                				new Swiper ('#listsshetuanhuodong', options)
                                                                                			})
		}
		
		// 商品列表样式五
		if(flag == 5) {
			vue.$nextTick(() => {
				var swiper = new Swiper('#lists-five-swiper', {
					loop: true,
					speed: 500,
					slidesPerView: 5,
					spaceBetween: 10,
					autoplay: {"delay":3000,"disableOnInteraction":false},
					centeredSlides: true,
					watchSlidesProgress: true,
					on: {
						setTranslate: function() {
							slides = this.slides
							for (i = 0; i < slides.length; i++) {
								slide = slides.eq(i)
								progress = slides[i].progress
								// slide.html(progress.toFixed(2)); //看清楚progress是怎么变化的
								slide.css({
									'opacity': '',
									'background': ''
								});
								slide.transform(''); //清除样式
				
								slide.transform('scale(' + (1.5 - Math.abs(progress) / 4) + ')');
							}
						},
						setTransition: function(transition) {
							for (var i = 0; i < this.slides.length; i++) {
								var slide = this.slides.eq(i)
								slide.transition(transition);
							}
						},
					},
					navigation: {"nextEl":".swiper-button-next","prevEl":".swiper-button-prev"},
					pagination: {"el":".swiper-pagination","clickable":true},
				});
			})
		}
		
        // vue.$nextTick(()=>{
        //   window.xznSlide();
        // });
      });
  });

  window.xznSlide = function() {
    // jQuery(".banner").slide({mainCell:".bd ul",autoPlay:true,interTime:5000});
    jQuery("#ifocus").slide({ titCell:"#ifocus_btn li", mainCell:"#ifocus_piclist ul",effect:"leftLoop", delayTime:200, autoPlay:true,triggerTime:0});
    jQuery("#ifocus").slide({ titCell:"#ifocus_btn li", mainCell:"#ifocus_tx ul",delayTime:0, autoPlay:true});
    jQuery(".product_list").slide({mainCell:".bd ul",autoPage:true,effect:"leftLoop",autoPlay:true,vis:5,trigger:"click",interTime:4000});
  };
</script>
<script src="../../xznstatic/js/index.js"></script>
</body>
</html>
