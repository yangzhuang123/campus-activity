<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>消息通知</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <style>
        .center-wrapper {
            display: flex;
            min-height: 500px;
        }
        .left-menu {
            width: 180px;
            background: #f5f5f5;
            border-right: 1px solid #eee;
            flex-shrink: 0;
        }
        .left-menu .layui-nav-tree {
            width: 100%;
        }
        .left-menu .layui-nav {
            position: relative;
            background: transparent;
        }
        .left-menu .layui-nav-item {
            height: 48px;
            line-height: 48px;
            font-size: 14px;
            color: #333;
        }
        .left-menu .layui-nav-item a {
            color: #333;
            padding: 0 20px;
        }
        .left-menu .layui-nav-item.layui-this,
        .left-menu .layui-nav-item:hover {
            background: #ff9900;
            color: #fff;
        }
        .left-menu .layui-nav-item.layui-this a,
        .left-menu .layui-nav-item:hover a {
            color: #fff;
        }
        .right-content {
            flex: 1;
            padding: 30px 40px;
            min-height: 500px;
        }
        .page-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #ff9900;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .notify-list {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .notify-item {
            padding: 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }
        .notify-item:hover {
            background: #f5f5f5;
        }
        .notify-item.unread {
            background: #f0f9ff;
        }
        .notify-item .notify-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .notify-item .notify-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }
        .notify-item .notify-time {
            font-size: 12px;
            color: #999;
        }
        .notify-item .notify-content {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 10px;
        }
        .notify-item .notify-footer {
            display: flex;
            justify-content: flex-end;
        }
        .btn {
            display: inline-block;
            padding: 6px 12px;
            border: 1px solid #ff9900;
            border-radius: 4px;
            font-size: 12px;
            background: #ff9900;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #47c07a;
        }
        .btn-outline {
            background: #fff;
            color: #ff9900;
        }
        .btn-outline:hover {
            background: #ff9900;
            color: #fff;
        }
        .empty-tip {
            text-align: center;
            padding: 80px 0;
            color: #999;
            font-size: 14px;
        }
        .empty-tip .layui-icon {
            font-size: 48px;
            color: #ddd;
            margin-bottom: 15px;
        }
        .pager {
            text-align: center;
            padding: 30px 0 10px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="center-wrapper">
            <div class="left-menu">
                <ul class="layui-nav layui-nav-tree">
                    <li v-for="(item,index) in centerMenu" v-bind:key="index" class="layui-nav-item" :class="item.name=='消息通知'?'layui-this':''">
                        <a :href="item.url" @click.prevent="jump(item.url)">{{item.name}}</a>
                    </li>
                </ul>
            </div>
            <div class="right-content">
                <div class="page-title">
                    <span>消息通知</span>
                </div>
                <div v-if="dataList.length === 0" class="empty-tip">
                    <div class="layui-icon">&#xe6c6;</div>
                    <p>暂无消息通知</p>
                </div>
                <div v-else class="notify-list">
                    <div v-for="(item,index) in dataList" :key="index" class="notify-item" :class="{'unread': item.yuedu === 0}">
                        <div class="notify-header">
                            <div class="notify-title">{{item.xiaoxibiaoti}}</div>
                            <div class="notify-time">{{formatDate(item.fabushijian)}}</div>
                        </div>
                        <div class="notify-content">{{item.xiaoxineirong}}</div>
                        <div class="notify-footer">
                            <button v-if="item.yuedu === 0" class="btn btn-outline" @click="markAsRead(item.id)">标记已读</button>
                        </div>
                    </div>
                </div>
                <div class="pager" id="pager"></div>
            </div>
        </div>
    </div>

    <script src="../../layui/layui.js"></script>
    <script src="../../js/vue.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../modules/config.js"></script>
    <script src="../../js/utils.js"></script>

    <script>
        var vue = new Vue({
            el: '#app',
            data: {
                dataList: [],
                centerMenu: centerMenu()
            },
            methods: {
                jump(url) {
                    jump(url)
                },
                markAsRead(id) {
                    layui.http.request('xiaoxi/read/' + id, 'get', {}, function(res) {
                        if (res.code === 0) {
                            pageList();
                        } else {
                            layui.layer.msg('操作失败: ' + (res.msg || '未知错误'), {icon: 5});
                        }
                    }, function(error) {
                        layui.layer.msg('操作失败', {icon: 5});
                    });
                },
                formatDate(date) {
                    try {
                        if (!date) return '暂无';
                        var d = new Date(date);
                        if (isNaN(d.getTime())) return '暂无';
                        var year = d.getFullYear();
                        var month = (d.getMonth() + 1).toString().padStart(2, '0');
                        var day = d.getDate().toString().padStart(2, '0');
                        var hours = d.getHours().toString().padStart(2, '0');
                        var minutes = d.getMinutes().toString().padStart(2, '0');
                        return year + '-' + month + '-' + day + ' ' + hours + ':' + minutes;
                    } catch (e) {
                        return '暂无';
                    }
                }
            }
        });

        var pageList;

        layui.use(['layer', 'http', 'jquery', 'laypage'], function() {
            var layer = layui.layer;
            var http = layui.http;
            var jquery = layui.jquery;
            var laypage = layui.laypage;

            var limit = 10;

            pageList = function() {
                var userTable = localStorage.getItem('userTable');
                var userid = localStorage.getItem('userid');
                var username = localStorage.getItem('adminName');

                if (!userTable || !userid || !username) {
                    layer.msg('请先登录', {icon: 5});
                    window.location.href = '../login/login.html';
                    return;
                }

                var param = {
                    page: 1,
                    limit: limit,
                    sort: 'fabushijian',
                    order: 'desc',
                    yonghu: username,
                    yonghutable: userTable
                };

                http.request('xiaoxi/list', 'get', param, function(res) {
                    if (res.code === 0) {
                        vue.dataList = res.data.list || [];
                        laypage.render({
                            elem: 'pager',
                            count: res.data.total || 0,
                            limit: limit,
                            groups: 5,
                            layout: ["prev", "page", "next"],
                            theme: '#ff9900',
                            jump: function(obj, first) {
                                if (!first) {
                                    param.page = obj.curr;
                                    http.request('xiaoxi/list', 'get', param, function(res) {
                                        if (res.code === 0) {
                                            vue.dataList = res.data.list || [];
                                        } else {
                                            layer.msg('获取数据失败: ' + (res.msg || '未知错误'), {icon: 5});
                                        }
                                    }, function(error) {
                                        layer.msg('网络错误，请稍后重试', {icon: 5});
                                    });
                                }
                            }
                        });
                    } else {
                        layer.msg('获取数据失败: ' + (res.msg || '未知错误'), {icon: 5});
                    }
                }, function(error) {
                    layer.msg('网络错误，请稍后重试', {icon: 5});
                });
            };

            pageList();
        });
    </script>
</body>
</html>
